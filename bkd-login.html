<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BKDLL | 客户登录</title>
<style>
:root{--navy:#0a1628;--blue:#1a56db;--teal:#0d9488;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:#111f3a;border:1px solid #1e3a5f;border-radius:16px;padding:40px 36px;width:min(92vw,380px);}
.logo-wrap{text-align:center;margin-bottom:28px;}
.logo-wrap img{height:48px;border-radius:8px;}
.logo-wrap h1{color:#fff;font-size:18px;font-weight:700;margin-top:12px;}
.logo-wrap p{color:#64748b;font-size:12px;margin-top:4px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.field input{width:100%;padding:11px 14px;background:#0d1e38;border:1.5px solid #1e3a5f;border-radius:9px;color:#fff;font-size:14px;outline:none;font-family:inherit;}
.field input:focus{border-color:var(--blue);}
.field input::placeholder{color:#475569;}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--blue),#1d4ed8);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;}
.btn:hover{opacity:.9;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.err{color:#f87171;font-size:12px;margin-top:8px;text-align:center;display:none;}
.ok{color:#86efac;font-size:12px;margin-top:8px;text-align:center;display:none;}
.forgot{text-align:center;margin-top:14px;}
.forgot a{color:#64748b;font-size:12px;cursor:pointer;}
.forgot a:hover{color:var(--blue);}
.contact-note{text-align:center;margin-top:22px;padding-top:18px;border-top:1px solid #1e3a5f;color:#475569;font-size:12px;line-height:1.6;}
.contact-note strong{color:#94a3b8;}
</style>
</head>
<body>
<div class="box">
  <div class="logo-wrap">
    <img src="logo.png" onerror="this.style.display='none'">
    <h1>BKDLL · 霖霖 国际物流</h1>
    <p>客户门户 Customer Portal</p>
  </div>

  <div id="loginForm">
    <div class="field">
      <label>邮箱</label>
      <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn">登 录</button>
    <div class="err" id="loginErr"></div>
    <div class="forgot"><a onclick="showReset()">忘记密码？</a></div>

    <div class="contact-note">
      <strong>账号开通</strong><br>
      如需开通账号，请联系您的对接客服
    </div>
  </div>

  <div id="resetForm" style="display:none;">
    <div class="field">
      <label>注册邮箱</label>
      <input type="email" id="resetEmail" placeholder="your@email.com">
    </div>
    <button class="btn" id="resetBtn">发送重置邮件</button>
    <div class="err" id="resetErr"></div>
    <div class="ok" id="resetOk"></div>
    <div class="forgot"><a onclick="backToLogin()">← 返回登录</a></div>
  </div>
</div>

<script>
// 香港后端 API
var BKDLL_API = 'https://api.bkdll.com';

function G(id){ return document.getElementById(id); }

window.showReset = function(){
  G('loginForm').style.display='none';
  G('resetForm').style.display='block';
};
window.backToLogin = function(){
  G('resetForm').style.display='none';
  G('loginForm').style.display='block';
};

// 把后端错误码翻译成人话
function translateError(code){
  var map = {
    'EMAIL_NOT_FOUND': '邮箱未注册',
    'INVALID_PASSWORD': '邮箱或密码错误',
    'INVALID_LOGIN_CREDENTIALS': '邮箱或密码错误',
    'USER_DISABLED': '账户已被禁用,请联系客服',
    'TOO_MANY_ATTEMPTS_TRY_LATER': '尝试次数过多,请稍后再试',
    'email_password_required': '请填写邮箱和密码',
    'login_failed': '登录失败,请重试',
    'no_token': '请重新登录',
    'invalid_token': '登录已过期,请重新登录'
  };
  return map[code] || code || '未知错误';
}

// 登录
G('loginBtn').addEventListener('click', async function(){
  var email = G('loginEmail').value.trim();
  var pass = G('loginPass').value;
  if(!email||!pass){ showErr('loginErr','请填写邮箱和密码'); return; }

  G('loginBtn').disabled=true; G('loginBtn').textContent='登录中…';

  try {
    var resp = await fetch(BKDLL_API + '/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email: email, password: pass})
    });
    var data = await resp.json();

    if(!data.ok){
      showErr('loginErr', translateError(data.error));
    } else {
      // 存登录态
      localStorage.setItem('bkdll_token', data.token);
      localStorage.setItem('bkdll_user', JSON.stringify(data.user));
      localStorage.setItem('bkdll_login_at', String(Date.now()));
      // 跳转
      window.location.href = 'bkd-dashboard.html';
    }
  } catch(e){
    console.error('[login]', e);
    showErr('loginErr', '网络错误,请重试');
  } finally {
    G('loginBtn').disabled=false;
    G('loginBtn').textContent='登 录';
  }
});

G('loginPass').addEventListener('keydown', function(e){ if(e.key==='Enter') G('loginBtn').click(); });

// 重置密码
G('resetBtn').addEventListener('click', async function(){
  var email = G('resetEmail').value.trim();
  if(!email){ showErr('resetErr','请填写邮箱'); return; }
  G('resetBtn').disabled=true; G('resetBtn').textContent='发送中…';

  try {
    await fetch(BKDLL_API + '/api/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email: email})
    });
    // 不管成功失败都显示成功(防枚举)
    G('resetErr').style.display='none';
    G('resetOk').textContent='如该邮箱已注册,重置邮件已发出,请查收';
    G('resetOk').style.display='block';
  } catch(e){
    G('resetErr').style.display='none';
    G('resetOk').textContent='如该邮箱已注册,重置邮件已发出,请查收';
    G('resetOk').style.display='block';
  }
  G('resetBtn').disabled=false; G('resetBtn').textContent='发送重置邮件';
});

G('resetEmail').addEventListener('keydown', function(e){ if(e.key==='Enter') G('resetBtn').click(); });

function showErr(id, msg){
  var el = G(id);
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(function(){el.style.display='none';}, 4000);
}
</script>
</body>
</html>
