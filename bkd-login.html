<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BKD 保凯达 | 客户登录</title>
<style>
:root{--navy:#0a1628;--blue:#1a56db;--teal:#0d9488;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:#111f3a;border:1px solid #1e3a5f;border-radius:16px;padding:40px 36px;width:min(92vw,380px);}
.logo-wrap{text-align:center;margin-bottom:24px;}
.logo-wrap img{height:48px;border-radius:8px;}
.logo-wrap h1{color:#fff;font-size:18px;font-weight:700;margin-top:12px;}
.logo-wrap p{color:#64748b;font-size:12px;margin-top:4px;}
.tabs{display:flex;background:#0d1e38;border-radius:9px;padding:3px;margin-bottom:22px;}
.tab{flex:1;text-align:center;padding:8px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:#64748b;transition:all .15s;}
.tab.active{background:#1a56db;color:#fff;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.field input{width:100%;padding:11px 14px;background:#0d1e38;border:1.5px solid #1e3a5f;border-radius:9px;color:#fff;font-size:14px;outline:none;font-family:inherit;}
.field input:focus{border-color:var(--blue);}
.field input::placeholder{color:#475569;}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--blue),#1d4ed8);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;}
.btn:hover{opacity:.9;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.err{color:#f87171;font-size:12px;margin-top:8px;text-align:center;display:none;}
.ok{color:#86efac;font-size:12px;margin-top:8px;text-align:center;display:none;}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;}
.divider span{color:#334155;font-size:11px;white-space:nowrap;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#1e3a5f;}
.forgot{text-align:center;margin-top:14px;}
.forgot a{color:#64748b;font-size:12px;cursor:pointer;}
.forgot a:hover{color:var(--blue);}
</style>
</head>
<body>
<div class="box">
  <div class="logo-wrap">
    <img src="logo.png" onerror="this.style.display='none'">
    <h1>保凯达·霖霖 国际物流</h1>
    <p>客户门户 Customer Portal</p>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">登录</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">注册</div>
  </div>

  <!-- 登录 -->
  <div id="loginForm">
    <div class="field">
      <label>邮箱</label>
      <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn">登 录</button>
    <div class="err" id="loginErr"></div>
    <div class="forgot"><a onclick="showReset()">忘记密码？</a></div>
  </div>

  <!-- 注册 -->
  <div id="registerForm" style="display:none;">
    <div class="field">
      <label>公司名 / 姓名</label>
      <input type="text" id="regName" placeholder="如：ABC Trading Co.">
    </div>
    <div class="field">
      <label>邮箱</label>
      <input type="email" id="regEmail" placeholder="your@email.com">
    </div>
    <div class="field">
      <label>密码（6位以上）</label>
      <input type="password" id="regPass" placeholder="••••••••">
    </div>
    <button class="btn" id="registerBtn">注 册</button>
    <div class="err" id="registerErr"></div>
    <div class="ok" id="registerOk"></div>
  </div>

  <!-- 重置密码 -->
  <div id="resetForm" style="display:none;">
    <div class="field">
      <label>注册邮箱</label>
      <input type="email" id="resetEmail" placeholder="your@email.com">
    </div>
    <button class="btn" id="resetBtn">发送重置邮件</button>
    <div class="err" id="resetErr"></div>
    <div class="ok" id="resetOk"></div>
    <div class="forgot"><a onclick="switchTab('login')">← 返回登录</a></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyA71fC4aW55bUx2UyLONCOJq27IC4OxGEs",
  authDomain: "bkdll-8323a.firebaseapp.com",
  projectId: "bkdll-8323a"
});
const auth = getAuth(app);

function G(id){ return document.getElementById(id); }

window.switchTab = function(tab){
  G('tab-login').className = 'tab'+(tab==='login'?' active':'');
  G('tab-register').className = 'tab'+(tab==='register'?' active':'');
  G('loginForm').style.display = tab==='login'?'block':'none';
  G('registerForm').style.display = tab==='register'?'block':'none';
  G('resetForm').style.display = 'none';
};

window.showReset = function(){
  G('loginForm').style.display='none';
  G('resetForm').style.display='block';
};

// 登录
G('loginBtn').addEventListener('click', async ()=>{
  var email = G('loginEmail').value.trim();
  var pass = G('loginPass').value;
  if(!email||!pass){ showErr('loginErr','请填写邮箱和密码'); return; }
  G('loginBtn').disabled=true; G('loginBtn').textContent='登录中…';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    window.location.href = 'bkd-portal.html';
  } catch(e){
    var msg = e.code==='auth/wrong-password'||e.code==='auth/invalid-credential' ? '密码错误' : e.code==='auth/user-not-found' ? '邮箱未注册' : e.message;
    showErr('loginErr', msg);
  }
  G('loginBtn').disabled=false; G('loginBtn').textContent='登 录';
});
G('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') G('loginBtn').click(); });

// 注册
G('registerBtn').addEventListener('click', async ()=>{
  var name = G('regName').value.trim();
  var email = G('regEmail').value.trim();
  var pass = G('regPass').value;
  if(!name||!email||!pass){ showErr('registerErr','请填写所有字段'); return; }
  if(pass.length<6){ showErr('registerErr','密码至少6位'); return; }
  G('registerBtn').disabled=true; G('registerBtn').textContent='注册中…';
  try {
    var cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    G('registerErr').style.display='none';
    G('registerOk').textContent='注册成功！正在跳转…';
    G('registerOk').style.display='block';
    setTimeout(()=>window.location.href='bkd-portal.html', 1500);
  } catch(e){
    var msg = e.code==='auth/email-already-in-use' ? '此邮箱已注册' : e.message;
    showErr('registerErr', msg);
  }
  G('registerBtn').disabled=false; G('registerBtn').textContent='注 册';
});

// 重置密码
G('resetBtn').addEventListener('click', async ()=>{
  var email = G('resetEmail').value.trim();
  if(!email){ showErr('resetErr','请填写邮箱'); return; }
  G('resetBtn').disabled=true; G('resetBtn').textContent='发送中…';
  try {
    await sendPasswordResetEmail(auth, email);
    G('resetErr').style.display='none';
    G('resetOk').textContent='重置邮件已发送，请查收邮箱';
    G('resetOk').style.display='block';
  } catch(e){
    showErr('resetErr', e.code==='auth/user-not-found'?'邮箱未注册':e.message);
  }
  G('resetBtn').disabled=false; G('resetBtn').textContent='发送重置邮件';
});

function showErr(id, msg){
  var el = G(id);
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(()=>el.style.display='none', 4000);
}
</script>
</body>
</html>
