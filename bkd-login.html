<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BKD 客户登录</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap');

  :root {
    --navy: #0d1b2a;
    --navy2: #142233;
    --amber: #e8a020;
    --amber2: #f5b84a;
    --text: #d4dde8;
    --muted: #5a7a9a;
    --border: #1e3450;
    --success: #2ecc71;
    --error: #e74c3c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.4;
    pointer-events: none;
  }

  .card {
    background: var(--navy2);
    border: 1px solid var(--border);
    border-top: 3px solid var(--amber);
    padding: 48px 44px 44px;
    width: 420px;
    position: relative;
    box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    animation: fadeUp .5s ease both;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 36px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: var(--amber);
    display: grid;
    place-items: center;
  }

  .logo-icon svg { width: 20px; height: 20px; fill: var(--navy); }

  .logo-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #fff;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 1px;
  }

  h1 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 6px;
    color: #fff;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 32px;
    line-height: 1.6;
  }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  input[type="email"] {
    width: 100%;
    background: var(--navy);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 13px 16px;
    font-size: 15px;
    font-family: 'IBM Plex Mono', monospace;
    outline: none;
    transition: border-color .2s;
  }

  input[type="email"]:focus {
    border-color: var(--amber);
  }

  input[type="email"]::placeholder { color: var(--muted); }

  .btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: var(--amber);
    color: var(--navy);
    border: none;
    font-size: 14px;
    font-weight: 500;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background .2s, transform .1s;
    position: relative;
  }

  .btn:hover { background: var(--amber2); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .msg {
    margin-top: 18px;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }

  .msg.success { background: rgba(46,204,113,.1); border-left: 3px solid var(--success); color: var(--success); display: block; }
  .msg.error   { background: rgba(231,76,60,.1);  border-left: 3px solid var(--error);   color: var(--error);   display: block; }

  .footer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }

  .corner {
    position: absolute;
    bottom: 12px;
    right: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--border);
    letter-spacing: 1px;
  }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--navy);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="logo-row">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L20 8.5v7L12 19.82 4 15.5v-7l8-4.32z"/></svg>
    </div>
    <div>
      <div class="logo-text">BKD</div>
      <div class="logo-sub">保凯达国际物流</div>
    </div>
  </div>

  <h1>客户登录</h1>
  <p class="subtitle">输入您的邮箱地址，我们将向您发送一个登录链接。</p>

  <label for="email">邮箱地址</label>
  <input type="email" id="email" placeholder="your@company.com" autocomplete="email">

  <button class="btn" id="loginBtn" onclick="handleLogin()">发送登录链接</button>

  <div class="msg" id="msg"></div>

  <div class="footer">
    账号未开通？请联系 BKD 运营团队：<br>
    <strong style="color:var(--text)">bkd@baokaida.com</strong>
  </div>

  <div class="corner">v1.0</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL  = 'https://zbilkisspbqzqqbhoxvv.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaWxraXNzcGJxenFxYmhveHZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MjcxNDYsImV4cCI6MjA4OTIwMzE0Nn0.IFTXWGpBNAcQQJMbQCf1qwfOkEjgDhqmDWctpQYIwFI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// 获取当前页面根路径，用于构建 redirectTo
const baseUrl = window.location.href.replace('bkd-login.html', '');

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

async function handleLogin() {
  const email = document.getElementById('email').value.trim();
  if (!email) { showMsg('请输入邮箱地址', 'error'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>发送中...';

  // 先检查是否在 customers 表里
  const { data: customers, error: dbErr } = await sb
    .from('customers')
    .select('id')
    .eq('email', email)
    .limit(1);

  if (dbErr || !customers || customers.length === 0) {
    showMsg('该邮箱未开通账号，请联系 BKD 运营团队。', 'error');
    btn.disabled = false;
    btn.innerHTML = '发送登录链接';
    return;
  }

  // 发送 magic link
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: {
      emailRedirectTo: baseUrl + 'bkd-portal.html'
    }
  });

  if (error) {
    showMsg('发送失败：' + error.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '发送登录链接';
  } else {
    showMsg('✅ 登录链接已发送！请检查您的邮箱（含垃圾邮件文件夹），点击链接即可登录。', 'success');
    btn.innerHTML = '已发送';
  }
}

document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
});
</script>
</body>
</html>
