<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BKDLL | 客户登录</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--bg:#F5F9FF;--sky:#EAF4FE;--sky2:#D4EBFD;
  --blue:#0A6EBD;--blue2:#0D85E0;--blue3:#1BA3F5;
  --navy:#0D2D4A;--navy2:#163A5C;
  --text:#0D2D4A;--text2:#3A5A7A;--muted:#6B8BAA;--border:#D6E8F5;
  --red:#dc2626;--red-bg:#FEE2E2;--green:#0E9E6E;--green-bg:#E5F7F1;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'DM Sans','Noto Sans SC',sans-serif;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:var(--text);
}
/* 顶部蓝条装饰 */
body::before{
  content:'';
  position:fixed;
  top:0;left:0;right:0;
  height:4px;
  background:linear-gradient(90deg,var(--blue),var(--blue3));
  z-index:100;
}
.box{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:16px;
  padding:44px 36px;
  width:min(92vw,400px);
  box-shadow:0 4px 24px rgba(10,110,189,0.08);
}
.logo-wrap{text-align:center;margin-bottom:30px;}
.logo-wrap img{height:56px;border-radius:10px;}
.logo-wrap h1{color:var(--navy);font-size:18px;font-weight:700;margin-top:14px;}
.logo-wrap p{color:var(--muted);font-size:12px;margin-top:4px;}
.field{margin-bottom:16px;}
.field label{
  display:block;
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:6px;
}
.field input{
  width:100%;
  padding:12px 14px;
  background:var(--bg);
  border:1.5px solid var(--border);
  border-radius:9px;
  color:var(--text);
  font-size:14px;
  outline:none;
  font-family:inherit;
  transition:all .15s;
}
.field input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(10,110,189,0.08);}
.field input::placeholder{color:var(--muted);}
.btn{
  width:100%;
  padding:13px;
  background:linear-gradient(135deg,var(--blue2),var(--blue));
  color:#fff;
  border:none;
  border-radius:9px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  margin-top:6px;
  font-family:inherit;
  transition:all .15s;
  letter-spacing:0.05em;
}
.btn:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 4px 12px rgba(10,110,189,0.25);}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}
.err{color:var(--red);background:var(--red-bg);font-size:12px;margin-top:10px;text-align:center;padding:8px 12px;border-radius:6px;display:none;}
.ok{color:var(--green);background:var(--green-bg);font-size:12px;margin-top:10px;text-align:center;padding:8px 12px;border-radius:6px;display:none;}
.forgot{text-align:center;margin-top:16px;}
.forgot a{color:var(--muted);font-size:12px;cursor:pointer;font-weight:500;}
.forgot a:hover{color:var(--blue);text-decoration:underline;}
.contact-note{
  text-align:center;
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}
.contact-note strong{color:var(--navy);display:inline-block;margin-bottom:4px;}
/* 移动端优化 */
@media (max-width:480px){
  .box{padding:32px 24px;}
  .logo-wrap img{height:48px;}
  .logo-wrap h1{font-size:16px;}
  .field input{font-size:16px;} /* iOS 防 zoom */
}
</style>
</head>
<body>
<div class="box">
  <div class="logo-wrap">
    <img src="logo.png" onerror="this.style.display='none'">
    <h1>BKDLL 香港国际物流</h1>
    <p>客户门户 Customer Portal</p>
  </div>

  <div id="loginForm">
    <div class="field">
      <label>邮箱</label>
      <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn">登 录</button>
    <div class="err" id="loginErr"></div>
    <div class="forgot"><a onclick="showReset()">忘记密码？</a></div>

    <div class="contact-note">
      <strong>账号开通</strong><br>
      如需开通账号，请联系您的对接客服
    </div>
  </div>

  <div id="resetForm" style="display:none;">
    <div class="field">
      <label>注册邮箱</label>
      <input type="email" id="resetEmail" placeholder="your@email.com">
    </div>
    <button class="btn" id="resetBtn">发送重置邮件</button>
    <div class="err" id="resetErr"></div>
    <div class="ok" id="resetOk"></div>
    <div class="forgot"><a onclick="backToLogin()">← 返回登录</a></div>
  </div>
</div>

<script>
// 香港后端 API
var BKDLL_API = 'https://api.bkdll.com';

function G(id){ return document.getElementById(id); }

window.showReset = function(){
  G('loginForm').style.display='none';
  G('resetForm').style.display='block';
};
window.backToLogin = function(){
  G('resetForm').style.display='none';
  G('loginForm').style.display='block';
};

// 把后端错误码翻译成人话
function translateError(code){
  var map = {
    'EMAIL_NOT_FOUND': '邮箱未注册',
    'INVALID_PASSWORD': '邮箱或密码错误',
    'INVALID_LOGIN_CREDENTIALS': '邮箱或密码错误',
    'USER_DISABLED': '账户已被禁用,请联系客服',
    'TOO_MANY_ATTEMPTS_TRY_LATER': '尝试次数过多,请稍后再试',
    'email_password_required': '请填写邮箱和密码',
    'login_failed': '登录失败,请重试',
    'no_token': '请重新登录',
    'invalid_token': '登录已过期,请重新登录'
  };
  return map[code] || code || '未知错误';
}

// 登录
G('loginBtn').addEventListener('click', async function(){
  var email = G('loginEmail').value.trim();
  var pass = G('loginPass').value;
  if(!email||!pass){ showErr('loginErr','请填写邮箱和密码'); return; }

  G('loginBtn').disabled=true; G('loginBtn').textContent='登录中…';

  try {
    var resp = await fetch(BKDLL_API + '/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email: email, password: pass})
    });
    var data = await resp.json();

    if(!data.ok){
      showErr('loginErr', translateError(data.error));
    } else {
      // 存登录态
      localStorage.setItem('bkdll_token', data.token);
      localStorage.setItem('bkdll_user', JSON.stringify(data.user));
      localStorage.setItem('bkdll_login_at', String(Date.now()));
      // 跳转
      window.location.href = 'bkd-dashboard.html';
    }
  } catch(e){
    console.error('[login]', e);
    showErr('loginErr', '网络错误,请重试');
  } finally {
    G('loginBtn').disabled=false;
    G('loginBtn').textContent='登 录';
  }
});

G('loginPass').addEventListener('keydown', function(e){ if(e.key==='Enter') G('loginBtn').click(); });

// 重置密码
G('resetBtn').addEventListener('click', async function(){
  var email = G('resetEmail').value.trim();
  if(!email){ showErr('resetErr','请填写邮箱'); return; }
  G('resetBtn').disabled=true; G('resetBtn').textContent='发送中…';

  try {
    await fetch(BKDLL_API + '/api/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email: email})
    });
    // 不管成功失败都显示成功(防枚举)
    G('resetErr').style.display='none';
    G('resetOk').textContent='如该邮箱已注册,重置邮件已发出,请查收';
    G('resetOk').style.display='block';
  } catch(e){
    G('resetErr').style.display='none';
    G('resetOk').textContent='如该邮箱已注册,重置邮件已发出,请查收';
    G('resetOk').style.display='block';
  }
  G('resetBtn').disabled=false; G('resetBtn').textContent='发送重置邮件';
});

G('resetEmail').addEventListener('keydown', function(e){ if(e.key==='Enter') G('resetBtn').click(); });

function showErr(id, msg){
  var el = G(id);
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(function(){el.style.display='none';}, 4000);
}
</script>
</body>
</html>
