<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BKD 保凯达 | 我的订单</title>
<style>
:root{--navy:#0a1628;--blue:#1a56db;--teal:#0d9488;--bg:#f0f4fa;--card:#fff;--border:#e2e8f2;--text:#0f172a;--muted:#64748b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.stripe{height:4px;background:linear-gradient(90deg,var(--blue),var(--teal));}
header{background:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(15,31,61,.06);}
header img{height:36px;border-radius:8px;}
.ht h1{font-size:16px;font-weight:800;color:var(--navy);}
.ht p{font-size:10px;color:var(--muted);}
.hright{margin-left:auto;display:flex;align-items:center;gap:12px;}
.user-badge{font-size:12px;color:var(--muted);}
.logout-btn{padding:6px 14px;border:1.5px solid var(--border);border-radius:7px;background:#fff;font-size:12px;cursor:pointer;color:var(--muted);}
.logout-btn:hover{border-color:var(--blue);color:var(--blue);}

.content{max-width:800px;margin:0 auto;padding:24px 16px 60px;}
.welcome{background:linear-gradient(135deg,var(--navy),#1a3a6b);border-radius:14px;padding:22px 24px;color:#fff;margin-bottom:20px;}
.welcome h2{font-size:18px;font-weight:700;}
.welcome p{font-size:12px;color:#94a3b8;margin-top:4px;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;}
.stat{background:rgba(255,255,255,.1);border-radius:10px;padding:12px 16px;}
.stat-n{font-size:24px;font-weight:700;}
.stat-l{font-size:11px;color:#94a3b8;margin-top:2px;}

.section-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:12px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.order-card{padding:16px 18px;cursor:pointer;transition:background .15s;}
.order-card:hover{background:#fafbff;}
.order-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.order-id{font-family:monospace;font-size:12px;font-weight:700;color:var(--blue);}
.status-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-left:auto;}
.s-pending{background:#fef3c7;color:#92400e;}
.s-transit{background:#dbeafe;color:#1e40af;}
.s-delivered{background:#dcfce7;color:#166534;}
.s-exception{background:#fee2e2;color:#991b1b;}
.order-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.info-item{font-size:12px;color:var(--muted);}
.info-item strong{color:var(--text);font-weight:600;}
.track-preview{margin-top:10px;padding:10px 12px;background:#f8faff;border-radius:8px;border-left:3px solid var(--blue);}
.track-latest{font-size:12px;color:var(--text);}
.track-time{font-size:10px;color:var(--muted);margin-top:2px;}
.expand-btn{font-size:11px;color:var(--blue);margin-top:8px;cursor:pointer;font-weight:600;}

.timeline{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.tl-item{display:flex;gap:12px;padding-bottom:12px;position:relative;}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:9px;top:20px;bottom:0;width:1.5px;background:var(--border);}
.tl-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;margin-top:2px;}
.tl-dot.first{background:linear-gradient(135deg,var(--blue),var(--teal));}
.tl-dot.normal{background:#f1f5f9;border:1.5px solid var(--border);}
.tl-text{font-size:12px;color:var(--text);line-height:1.5;}
.tl-time{font-size:10px;color:var(--muted);}

.loading{text-align:center;padding:48px;color:var(--muted);font-size:13px;}
.spin{display:inline-block;width:20px;height:20px;border:2px solid #e2e8f0;border-top-color:var(--blue);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:48px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;}
.overlay.on{display:flex;}
.modal{background:#fff;border-radius:14px;width:min(94vw,520px);max-height:85vh;display:flex;flex-direction:column;}
.modal-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-size:14px;font-weight:700;}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1;}

@media(max-width:500px){.stats-row{grid-template-columns:1fr 1fr;}.order-info{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="stripe"></div>
<header>
  <img src="logo.png" onerror="this.style.display='none'">
  <div class="ht"><h1>保凯达·霖霖 国际物流</h1><p>客户门户 Customer Portal</p></div>
  <div class="hright">
    <span class="user-badge" id="userBadge"></span>
    <button class="logout-btn" id="logoutBtn">退出</button>
  </div>
</header>

<div class="content">
  <div class="welcome">
    <h2 id="welcomeText">欢迎回来</h2>
    <p>以下是您的所有快件信息，实时更新</p>
    <div class="stats-row">
      <div class="stat"><div class="stat-n" id="ws-total">—</div><div class="stat-l">总订单</div></div>
      <div class="stat"><div class="stat-n" id="ws-transit">—</div><div class="stat-l">运输中</div></div>
      <div class="stat"><div class="stat-n" id="ws-done">—</div><div class="stat-l">已签收</div></div>
    </div>
  </div>

  <div class="section-title">我的快件</div>
  <div id="ordersList"><div class="loading"><span class="spin"></span>加载中…</div></div>
</div>

<!-- 物流详情 Modal -->
<div class="overlay" id="trackModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="trackModalTitle">物流详情</h3>
      <button class="modal-close" id="trackModalClose">✕</button>
    </div>
    <div class="modal-body" id="trackModalBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyA71fC4aW55bUx2UyLONCOJq27IC4OxGEs",
  authDomain: "bkdll-8323a.firebaseapp.com",
  projectId: "bkdll-8323a"
});
const auth = getAuth(app);
const db = getFirestore(app);
const TRACK_WORKER = 'https://bkd-track.bkd-666.workers.dev';

function G(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 检查登录状态
onAuthStateChanged(auth, async user => {
  if(!user){ window.location.href='bkd-login.html'; return; }
  var name = user.displayName || user.email.split('@')[0];
  G('userBadge').textContent = name;
  G('welcomeText').textContent = '欢迎回来，' + name;
  loadOrders(user.email);
});

G('logoutBtn').addEventListener('click', async ()=>{
  await signOut(auth);
  window.location.href = 'bkd-login.html';
});

G('trackModalClose').addEventListener('click', ()=>G('trackModal').classList.remove('on'));
G('trackModal').addEventListener('click', e=>{ if(e.target===G('trackModal'))G('trackModal').classList.remove('on'); });

async function loadOrders(email){
  try {
    var q = query(collection(db,'orders'), where('email','==',email), orderBy('createdAt','desc'));
    var snap = await getDocs(q);
    var orders = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderOrders(orders);
  } catch(e){
    // 如果没有index，尝试不排序
    try {
      var q2 = query(collection(db,'orders'), where('email','==',email));
      var snap2 = await getDocs(q2);
      var orders2 = snap2.docs.map(d=>({id:d.id,...d.data()}));
      orders2.sort((a,b)=>{
        var ta = a.createdAt?.toDate?.()?.getTime() || new Date(a.submitTime||0).getTime();
        var tb = b.createdAt?.toDate?.()?.getTime() || new Date(b.submitTime||0).getTime();
        return tb-ta;
      });
      renderOrders(orders2);
    } catch(e2){
      G('ordersList').innerHTML = '<div class="loading">加载失败：'+e2.message+'</div>';
    }
  }
}

function renderOrders(orders){
  var total = orders.length;
  var transit = orders.filter(o=>o.trackingNumber && o.status!=='已签收').length;
  var done = orders.filter(o=>o.status==='已签收').length;
  G('ws-total').textContent = total;
  G('ws-transit').textContent = transit;
  G('ws-done').textContent = done;

  if(!orders.length){
    G('ordersList').innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>暂无订单记录</p></div>';
    return;
  }

  G('ordersList').innerHTML = orders.map(o=>{
    var st = o.status||'待处理';
    var stClass = st==='已签收'?'s-delivered':st==='运输中'?'s-transit':st==='异常'?'s-exception':'s-pending';
    var date = '';
    if(o.createdAt&&o.createdAt.toDate) date=o.createdAt.toDate().toLocaleDateString('zh-CN');
    else if(o.submitTime) date=o.submitTime.slice(0,10);
    var trackNum = o.trackingNumber
      ? `<span style="font-family:monospace;color:var(--teal);">${esc(o.trackingNumber)}</span>`
      : '<span style="color:#cbd5e1;">待录入</span>';
    var latestTrack = o.lastStatus
      ? `<div class="track-preview"><div class="track-latest">📍 ${esc(o.lastStatus)}</div></div>`
      : '';
    var queryBtn = o.trackingNumber
      ? `<div class="expand-btn" data-num="${esc(o.trackingNumber)}" data-oid="${esc(o.orderId||o.id)}">🔍 查看完整物流轨迹 →</div>`
      : '';
    return `<div class="card">
      <div class="order-card">
        <div class="order-top">
          <span class="order-id">${esc(o.orderId||o.id)}</span>
          <span class="status-badge ${stClass}">${esc(st)}</span>
        </div>
        <div class="order-info">
          <div class="info-item"><strong>货物：</strong>${esc(o.goods||'—')}</div>
          <div class="info-item"><strong>渠道：</strong>${esc(o.channel||'—')}</div>
          <div class="info-item"><strong>目的地：</strong>${esc(o.destCountry||o.country||'—')}</div>
          <div class="info-item"><strong>运单号：</strong>${trackNum}</div>
          <div class="info-item"><strong>下单日期：</strong>${date}</div>
          <div class="info-item"><strong>申报价值：</strong>${esc(o.amount||'—')} ${esc(o.currency||'USD')}</div>
        </div>
        ${latestTrack}
        ${queryBtn}
      </div>
    </div>`;
  }).join('');

  // 绑定查询按钮
  G('ordersList').querySelectorAll('.expand-btn[data-num]').forEach(btn=>{
    btn.addEventListener('click', ()=>openTrackModal(btn.dataset.num, btn.dataset.oid));
  });
}

async function openTrackModal(num, orderId){
  G('trackModalTitle').textContent = '物流轨迹 — ' + orderId;
  G('trackModalBody').innerHTML = '<div class="loading"><span class="spin"></span>查询中…</div>';
  G('trackModal').classList.add('on');
  try {
    var r = await fetch(TRACK_WORKER, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({num})
    });
    var d = await r.json();
    if(!d||!d.data||!d.data.length){
      G('trackModalBody').innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted);">暂无轨迹信息</div>';
      return;
    }
    var stateMap = {'0':'运输中','1':'已揽收','2':'疑难件','3':'已签收','4':'已退签','5':'派件中'};
    var stateText = stateMap[String(d.state)]||'运输中';
    G('trackModalBody').innerHTML = `
      <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;">
        运单：<strong style="font-family:monospace;">${esc(num)}</strong> &nbsp;·&nbsp; 状态：<strong>${stateText}</strong>
      </div>
      ${d.data.map((t,i)=>`
        <div class="tl-item">
          <div class="tl-dot ${i===0?'first':'normal'}"></div>
          <div>
            <div class="tl-time">${esc(t.ftime||t.time||'')}</div>
            <div class="tl-text" style="${i===0?'font-weight:700;color:var(--navy);':''}">${esc(t.context||'')}</div>
          </div>
        </div>`).join('')}`;
  } catch(e){
    G('trackModalBody').innerHTML = '<div style="color:#dc2626;font-size:13px;padding:16px;">查询失败：'+e.message+'</div>';
  }
}
</script>
</body>
</html>
