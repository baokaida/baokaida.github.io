<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BKD 客户中心</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap');

  :root {
    --navy: #0d1b2a;
    --navy2: #142233;
    --navy3: #1a2d44;
    --amber: #e8a020;
    --amber2: #f5b84a;
    --text: #d4dde8;
    --muted: #5a7a9a;
    --border: #1e3450;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }

  /* AUTH GATE */
  #authGate {
    position: fixed; inset: 0;
    background: var(--navy);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }

  .auth-msg {
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
    font-size: 14px;
  }

  .auth-msg .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--amber);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(16px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* HEADER */
  header {
    position: relative; z-index: 1;
    border-bottom: 1px solid var(--border);
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .logo-row {
    display: flex; align-items: center; gap: 12px;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: var(--amber);
    display: grid; place-items: center;
  }

  .logo-icon svg { width: 18px; height: 18px; fill: var(--navy); }

  .logo-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #fff;
  }

  .user-row {
    display: flex; align-items: center; gap: 16px;
    font-size: 13px;
  }

  .user-name {
    color: var(--muted);
  }

  .user-email {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--amber);
  }

  .logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
    letter-spacing: .5px;
    transition: all .2s;
  }

  .logout-btn:hover {
    border-color: var(--amber);
    color: var(--amber);
  }

  /* MAIN */
  main {
    position: relative; z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 40px;
  }

  .welcome {
    margin-bottom: 40px;
    animation: fadeUp .4s ease both;
  }

  .welcome h1 {
    font-size: 28px;
    font-weight: 300;
    color: #fff;
    margin-bottom: 8px;
  }

  .welcome h1 strong {
    color: var(--amber);
    font-weight: 500;
  }

  .welcome p {
    font-size: 14px;
    color: var(--muted);
  }

  /* MODULE CARDS */
  .modules {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 40px;
  }

  .module-card {
    background: var(--navy2);
    border: 1px solid var(--border);
    border-top: 3px solid var(--border);
    padding: 28px;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: border-color .2s, transform .2s;
    animation: fadeUp .4s ease both;
    position: relative;
    overflow: hidden;
  }

  .module-card:nth-child(1) { animation-delay: .05s; border-top-color: var(--amber); }
  .module-card:nth-child(2) { animation-delay: .10s; }
  .module-card:nth-child(3) { animation-delay: .15s; }

  .module-card:hover {
    border-color: var(--amber);
    border-top-color: var(--amber);
    transform: translateY(-2px);
  }

  .card-icon {
    width: 40px; height: 40px;
    background: var(--navy3);
    border: 1px solid var(--border);
    display: grid; place-items: center;
    margin-bottom: 16px;
  }

  .card-icon svg { width: 20px; height: 20px; stroke: var(--amber); fill: none; stroke-width: 1.5; }

  .card-title {
    font-size: 16px;
    font-weight: 500;
    color: #fff;
    margin-bottom: 6px;
  }

  .card-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  .card-arrow {
    position: absolute;
    right: 20px; top: 50%;
    transform: translateY(-50%);
    color: var(--border);
    font-size: 20px;
    transition: color .2s, right .2s;
  }

  .module-card:hover .card-arrow {
    color: var(--amber);
    right: 16px;
  }

  /* INFO TABLE */
  .info-section {
    background: var(--navy2);
    border: 1px solid var(--border);
    animation: fadeUp .4s .2s ease both;
  }

  .section-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .info-row {
    display: flex;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    gap: 24px;
  }

  .info-row:last-child { border-bottom: none; }

  .info-label {
    color: var(--muted);
    min-width: 120px;
    font-size: 12px;
  }

  .info-value {
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }
</style>
</head>
<body>

<!-- 验证中遮罩 -->
<div id="authGate">
  <div class="auth-msg">
    <div class="spinner"></div>
    <div>验证登录状态中...</div>
  </div>
</div>

<header>
  <div class="logo-row">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L20 8.5v7L12 19.82 4 15.5v-7l8-4.32z"/></svg>
    </div>
    <div>
      <div class="logo-text">BKD</div>
    </div>
  </div>
  <div class="user-row">
    <div>
      <div class="user-name" id="userName">—</div>
      <div class="user-email" id="userEmail">—</div>
    </div>
    <button class="logout-btn" onclick="handleLogout()">退出登录</button>
  </div>
</header>

<main>
  <div class="welcome">
    <h1>欢迎回来，<strong id="welcomeName">—</strong></h1>
    <p>保凯达国际物流客户服务中心</p>
  </div>

  <div class="modules">
    <a class="module-card" href="bkd-order.html">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M8 12h8M12 8v8"/></svg>
      </div>
      <div class="card-title">在线下单</div>
      <div class="card-desc">填写货物信息，提交出口运输订单，自动生成单号。</div>
      <div class="card-arrow">›</div>
    </a>

    <a class="module-card" href="bkd-track.html">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </div>
      <div class="card-title">运单追踪</div>
      <div class="card-desc">实时查询 DHL / FedEx / UPS 运单状态与物流轨迹。</div>
      <div class="card-arrow">›</div>
    </a>

    <a class="module-card" href="mailto:bkd@baokaida.com">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 4l8 9 8-9"/></svg>
      </div>
      <div class="card-title">联系客服</div>
      <div class="card-desc">有任何问题，发邮件至 bkd@baokaida.com 联系我们。</div>
      <div class="card-arrow">›</div>
    </a>
  </div>

  <div class="info-section">
    <div class="section-header">账户信息</div>
    <div class="info-row">
      <div class="info-label">客户名称</div>
      <div class="info-value" id="infoName">—</div>
    </div>
    <div class="info-row">
      <div class="info-label">邮箱</div>
      <div class="info-value" id="infoEmail">—</div>
    </div>
    <div class="info-row">
      <div class="info-label">注册时间</div>
      <div class="info-value" id="infoCreated">—</div>
    </div>
    <div class="info-row">
      <div class="info-label">服务热线</div>
      <div class="info-value">bkd@baokaida.com</div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL  = 'https://zbilkisspbqzqqbhoxvv.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaWxraXNzcGJxenFxYmhveHZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MjcxNDYsImV4cCI6MjA4OTIwMzE0Nn0.IFTXWGpBNAcQQJMbQCf1qwfOkEjgDhqmDWctpQYIwFI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

async function init() {
  const { data: { session } } = await sb.auth.getSession();

  if (!session) {
    window.location.href = 'bkd-login.html';
    return;
  }

  const email = session.user.email;

  // 查 customers 表获取 name 等信息
  const { data: cust } = await sb
    .from('customers')
    .select('*')
    .eq('email', email)
    .single();

  const name = cust?.name || email.split('@')[0];
  const created = cust?.created_at
    ? new Date(cust.created_at).toLocaleDateString('zh-CN')
    : '—';

  document.getElementById('userName').textContent = name;
  document.getElementById('userEmail').textContent = email;
  document.getElementById('welcomeName').textContent = name;
  document.getElementById('infoName').textContent = name;
  document.getElementById('infoEmail').textContent = email;
  document.getElementById('infoCreated').textContent = created;

  document.getElementById('authGate').style.display = 'none';
}

async function handleLogout() {
  await sb.auth.signOut();
  window.location.href = 'bkd-login.html';
}

init();
</script>
</body>
</html>
