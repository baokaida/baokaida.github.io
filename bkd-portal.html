<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BKD 保凯达 | 客户门户</title>
<style>
:root{--navy:#0a1628;--blue:#1a56db;--teal:#0d9488;--bg:#f0f4fa;--card:#fff;--border:#e2e8f2;--text:#0f172a;--muted:#64748b;--amber:#d97706;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'SF Pro Display',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.stripe{height:4px;background:linear-gradient(90deg,var(--blue),var(--teal));}
header{background:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(15,31,61,.06);}
header img{height:36px;border-radius:8px;}
.ht h1{font-size:16px;font-weight:800;color:var(--navy);}
.ht p{font-size:10px;color:var(--muted);}
.hright{margin-left:auto;display:flex;align-items:center;gap:12px;}
.user-badge{font-size:12px;color:var(--muted);}
.logout-btn{padding:6px 14px;border:1.5px solid var(--border);border-radius:7px;background:#fff;font-size:12px;cursor:pointer;color:var(--muted);}
.logout-btn:hover{border-color:var(--blue);color:var(--blue);}

/* 标签页 */
.tabs-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:0;}
.tab-btn{padding:14px 20px;font-size:13px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab-btn:hover{color:var(--blue);}

.content{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}
.page{display:none;}
.page.active{display:block;}

/* 统计卡 */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.stat-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.stat-val{font-size:26px;font-weight:700;color:var(--navy);}

/* 表格 */
.table-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.table-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.table-header h3{font-size:14px;font-weight:700;color:var(--navy);}
.search-input{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);outline:none;width:200px;}
.search-input:focus{border-color:var(--blue);}
.btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-sm{padding:4px 10px;font-size:11px;}
table{width:100%;border-collapse:collapse;}
th{background:#f8faff;padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);}
td{padding:11px 14px;font-size:13px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafbff;}
.order-id{font-family:monospace;font-weight:700;color:var(--blue);font-size:12px;}
.status-badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.s-pending{background:#fef3c7;color:#92400e;}
.s-transit{background:#dbeafe;color:#1e40af;}
.s-delivered{background:#dcfce7;color:#166634;}
.s-exception{background:#fee2e2;color:#991b1b;}
.track-num{font-family:monospace;font-size:12px;color:var(--teal);}

/* 报价页 */
.quote-header{background:linear-gradient(135deg,var(--navy),#1a3a6b);border-radius:14px;padding:24px;color:#fff;margin-bottom:20px;}
.quote-header h2{font-size:18px;font-weight:700;margin-bottom:4px;}
.quote-header p{font-size:12px;color:#94a3b8;}
.calc-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;}
.calc-card h3{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:14px;}
.calc-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
.calc-field{flex:1;min-width:140px;}
.calc-field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.calc-field input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:monospace;outline:none;}
.calc-field input:focus{border-color:var(--blue);}
.btn-calc{padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.btn-calc:hover{opacity:.9;}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px;}
.result-card{background:#f8faff;border:1.5px solid var(--border);border-radius:10px;padding:16px;transition:border-color .15s;}
.result-card:hover{border-color:var(--blue);}
.result-channel{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.result-price{font-size:26px;font-weight:700;color:var(--blue);margin-bottom:2px;}
.result-price span{font-size:12px;color:var(--muted);font-weight:400;}
.result-days{font-size:11px;color:var(--muted);margin-bottom:8px;}
.result-detail{font-size:11px;color:var(--muted);border-top:1px solid var(--border);padding-top:8px;font-family:monospace;line-height:1.8;}
.rates-table{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.no-rates{text-align:center;padding:48px;color:var(--muted);}

.loading{text-align:center;padding:48px;color:var(--muted);font-size:13px;}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #e2e8f0;border-top-color:var(--blue);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:48px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;}
.overlay.on{display:flex;}
.modal{background:#fff;border-radius:14px;width:min(94vw,560px);max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.18);}
.modal-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-size:14px;font-weight:700;}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1;}
.tl-item{display:flex;gap:12px;padding-bottom:14px;position:relative;}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:9px;top:20px;bottom:0;width:1.5px;background:var(--border);}
.tl-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;margin-top:2px;}
.tl-dot.first{background:linear-gradient(135deg,var(--blue),var(--teal));}
.tl-dot.normal{background:#f1f5f9;border:1.5px solid var(--border);}
.tl-text{font-size:13px;color:var(--text);line-height:1.5;}
.tl-time{font-size:10px;color:var(--muted);margin-bottom:2px;}

@media(max-width:768px){
  .stats-grid{grid-template-columns:1fr 1fr;}
  .content{padding:16px 12px 40px;}
  .search-input{width:130px;}
  .results-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="stripe"></div>
<header>
  <img src="logo.png" onerror="this.style.display='none'">
  <div class="ht"><h1>保凯达·霖霖 国际物流</h1><p>客户门户 Customer Portal</p></div>
  <div class="hright">
    <span class="user-badge" id="userBadge"></span>
    <button class="logout-btn" id="logoutBtn">退出登录</button>
  </div>
</header>

<div class="tabs-bar">
  <button class="tab-btn active" data-tab="orders">📦 我的订单</button>
  <button class="tab-btn" data-tab="quotes">💰 专属报价</button>
</div>

<div class="content">

  <!-- 订单页 -->
  <div class="page active" id="page-orders">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">总订单</div><div class="stat-val" id="ws-total">—</div></div>
      <div class="stat-card"><div class="stat-label">待处理</div><div class="stat-val" id="ws-pending">—</div></div>
      <div class="stat-card"><div class="stat-label">运输中</div><div class="stat-val" id="ws-transit">—</div></div>
      <div class="stat-card"><div class="stat-label">已签收</div><div class="stat-val" id="ws-done">—</div></div>
    </div>
    <div class="table-card">
      <div class="table-header">
        <h3>我的快件</h3>
        <div style="display:flex;gap:8px;">
          <input type="text" class="search-input" id="searchInput" placeholder="搜索订单号 / 货物…">
          <button class="btn btn-teal" id="exportBtn">⬇ 导出 Excel</button>
        </div>
      </div>
      <div id="tableWrap"><div class="loading"><span class="spin"></span>加载中…</div></div>
    </div>
  </div>

  <!-- 报价页 -->
  <div class="page" id="page-quotes">
    <div class="quote-header">
      <h2 id="quoteWelcome">您的专属运费报价</h2>
      <p>以下报价仅限您的账户使用，输入重量即时计算运费</p>
    </div>
    <div class="calc-card">
      <h3>运费计算器</h3>
      <div class="calc-row">
        <div class="calc-field">
          <label>货物重量 (kg)</label>
          <input type="number" id="weightInput" placeholder="如 2.5" step="0.1" min="0.1">
        </div>
        <button class="btn-calc" id="calcBtn">计算运费</button>
      </div>
      <div class="results-grid" id="resultsGrid" style="display:none;margin-top:16px;"></div>
    </div>
    <div class="rates-table" id="ratesTable">
      <div class="loading"><span class="spin"></span>加载报价中…</div>
    </div>
  </div>

</div>

<!-- 物流轨迹 Modal -->
<div class="overlay" id="trackModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="trackModalTitle">物流轨迹</h3>
      <button class="modal-close" id="trackModalClose">✕</button>
    </div>
    <div class="modal-body" id="trackModalBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyA71fC4aW55bUx2UyLONCOJq27IC4OxGEs",
  authDomain: "bkdll-8323a.firebaseapp.com",
  projectId: "bkdll-8323a"
});
const auth = getAuth(app);
const db = getFirestore(app);
const TRACK_WORKER = 'https://bkd-track.bkd-666.workers.dev';

const SUPA_URL = 'https://zbilkisspbqzqqbhoxvv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaWxraXNzcGJxenFxYmhveHZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MjcxNDYsImV4cCI6MjA4OTIwMzE0Nn0.IFTXWGpBNAcQQJMbQCf1qwfOkEjgDhqmDWctpQYIwFI';

function G(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var allOrders = [];
var myRates = [];
var currentEmail = '';

// ── 登录检查 ──
onAuthStateChanged(auth, async user => {
  if(!user){ window.location.href='bkd-login.html'; return; }
  currentEmail = user.email;
  var name = user.displayName || user.email.split('@')[0];
  G('userBadge').textContent = name;
  G('quoteWelcome').textContent = `${name} 的专属运费报价`;
  loadOrders(user.email);
  loadQuotes(user.email);
});

G('logoutBtn').addEventListener('click', async ()=>{ await signOut(auth); window.location.href='bkd-login.html'; });
G('trackModalClose').addEventListener('click', ()=>G('trackModal').classList.remove('on'));
G('trackModal').addEventListener('click', e=>{ if(e.target===G('trackModal'))G('trackModal').classList.remove('on'); });
G('searchInput').addEventListener('input', renderTable);
G('exportBtn').addEventListener('click', exportExcel);
G('calcBtn').addEventListener('click', calculate);
G('weightInput').addEventListener('keydown', e=>{ if(e.key==='Enter') calculate(); });

// ── 标签页切换 ──
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    G('page-'+btn.dataset.tab).classList.add('active');
  });
});

// ── 加载订单 ──
async function loadOrders(email){
  try {
    var q = query(collection(db,'orders'), where('email','==',email), orderBy('createdAt','desc'));
    var snap = await getDocs(q);
    allOrders = snap.docs.map(d=>({id:d.id,...d.data()}));
    updateStats(); renderTable();
  } catch(e){
    try {
      var q2 = query(collection(db,'orders'), where('email','==',email));
      var snap2 = await getDocs(q2);
      allOrders = snap2.docs.map(d=>({id:d.id,...d.data()}));
      allOrders.sort((a,b)=>{
        var ta=a.createdAt?.toDate?.()?.getTime()||new Date(a.submitTime||0).getTime();
        var tb=b.createdAt?.toDate?.()?.getTime()||new Date(b.submitTime||0).getTime();
        return tb-ta;
      });
      updateStats(); renderTable();
    } catch(e2){
      G('tableWrap').innerHTML='<div class="loading">加载失败：'+e2.message+'</div>';
    }
  }
}

function updateStats(){
  G('ws-total').textContent = allOrders.length;
  G('ws-pending').textContent = allOrders.filter(o=>!o.trackingNumber).length;
  G('ws-transit').textContent = allOrders.filter(o=>o.trackingNumber&&o.status!=='已签收').length;
  G('ws-done').textContent = allOrders.filter(o=>o.status==='已签收').length;
}

function renderTable(){
  var kw=(G('searchInput').value||'').toLowerCase();
  var list=kw?allOrders.filter(o=>
    (o.orderId||'').toLowerCase().includes(kw)||
    (o.goods||'').toLowerCase().includes(kw)||
    (o.trackingNumber||'').toLowerCase().includes(kw)
  ):allOrders;

  if(!list.length){
    G('tableWrap').innerHTML='<div class="empty"><div class="empty-icon">📭</div><p>暂无订单记录</p></div>';
    return;
  }

  var rows=list.map(o=>{
    var st=o.status||'待处理';
    var stClass=st==='已签收'?'s-delivered':st==='运输中'?'s-transit':st==='异常'?'s-exception':'s-pending';
    var date='';
    if(o.createdAt&&o.createdAt.toDate) date=o.createdAt.toDate().toLocaleDateString('zh-CN');
    else if(o.submitTime) date=o.submitTime.slice(0,10);
    var trackCell=o.trackingNumber
      ?`<span class="track-num">${esc(o.trackingNumber)}</span>`
      :`<span style="color:#cbd5e1;font-size:11px;">待录入</span>`;
    var queryBtn=o.trackingNumber
      ?`<button class="btn btn-primary btn-sm" data-num="${esc(o.trackingNumber)}" data-oid="${esc(o.orderId||o.id)}">查轨迹</button>`
      :'';
    return `<tr>
      <td><span class="order-id">${esc(o.orderId||o.id)}</span></td>
      <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(o.goods||'—')}</td>
      <td style="font-size:12px;">${esc(o.channel||'—')}</td>
      <td>${esc(o.destCountry||o.country||'—')}</td>
      <td>${trackCell}</td>
      <td><span class="status-badge ${stClass}">${esc(st)}</span></td>
      <td style="font-size:11px;color:var(--muted);">${date}</td>
      <td>${queryBtn}</td>
    </tr>`;
  }).join('');

  G('tableWrap').innerHTML=`<div style="overflow-x:auto;"><table>
    <thead><tr>
      <th>订单号</th><th>货物</th><th>渠道</th><th>目的国</th>
      <th>运单号</th><th>状态</th><th>日期</th><th>操作</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;

  G('tableWrap').querySelectorAll('[data-num]').forEach(btn=>{
    btn.addEventListener('click',()=>openTrackModal(btn.dataset.num,btn.dataset.oid));
  });
}

// ── 物流查询 ──
async function openTrackModal(num,orderId){
  G('trackModalTitle').textContent='物流轨迹 — '+orderId;
  G('trackModalBody').innerHTML='<div class="loading"><span class="spin"></span>查询中…</div>';
  G('trackModal').classList.add('on');
  try {
    var r=await fetch(TRACK_WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({num})});
    var d=await r.json();
    if(!d||!d.data||!d.data.length){
      G('trackModalBody').innerHTML='<div style="text-align:center;padding:30px;color:var(--muted);">暂无轨迹信息</div>';
      return;
    }
    var stateMap={'0':'运输中','1':'已揽收','2':'疑难件','3':'已签收','4':'已退签','5':'派件中'};
    G('trackModalBody').innerHTML=`
      <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12px;">
        运单：<strong style="font-family:monospace;">${esc(num)}</strong> &nbsp;·&nbsp; 状态：<strong>${stateMap[String(d.state)]||'运输中'}</strong>
      </div>
      ${d.data.map((t,i)=>`
        <div class="tl-item">
          <div class="tl-dot ${i===0?'first':'normal'}"></div>
          <div style="flex:1;">
            <div class="tl-time">${esc(t.ftime||t.time||'')}</div>
            <div class="tl-text" style="${i===0?'font-weight:700;color:var(--navy);':''}">${esc(t.context||'')}</div>
          </div>
        </div>`).join('')}`;
  } catch(e){
    G('trackModalBody').innerHTML='<div style="color:#dc2626;font-size:13px;padding:16px;">查询失败：'+e.message+'</div>';
  }
}

// ── 加载专属报价（Supabase）──
async function loadQuotes(email){
  try {
    const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
    const {data:cust} = await sb.from('customers').select('*').eq('email',email).single();
    if(!cust){ showNoRates(); return; }
    const {data:rates} = await sb.from('customer_rates').select('*').eq('customer_id',cust.id).order('channel');
    if(!rates||!rates.length){ showNoRates(); return; }
    myRates = rates;
    renderRatesTable(rates);
  } catch(e){
    showNoRates();
  }
}

function showNoRates(){
  G('ratesTable').innerHTML=`<div class="no-rates">
    <div style="font-size:36px;margin-bottom:12px;">💰</div>
    <p style="font-size:13px;color:var(--muted);">暂无专属报价，请联系 BKD 运营团队开通。</p>
    <p style="font-size:12px;color:var(--blue);margin-top:8px;">bkd@baokaida.com</p>
  </div>`;
}

function renderRatesTable(rates){
  G('ratesTable').innerHTML=`
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;color:var(--navy);">专属报价表</div>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>
        <th>渠道</th><th>首重</th><th>续重单位</th><th>续重价格</th><th>时效</th>
      </tr></thead>
      <tbody>${rates.map(r=>`<tr>
        <td style="font-weight:700;color:var(--blue);">${esc(r.channel)}</td>
        <td>前 ${r.first_weight}kg · <strong>¥${r.first_price}</strong></td>
        <td>每 ${r.extra_unit}kg</td>
        <td><strong>¥${r.extra_price}</strong></td>
        <td style="color:var(--muted);font-family:monospace;">${r.days_min}–${r.days_max} 天</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
}

// ── 计算运费 ──
function calcPrice(r, weight){
  if(weight <= r.first_weight) return r.first_price;
  const extra = weight - r.first_weight;
  const units = Math.ceil(extra / r.extra_unit);
  return r.first_price + units * r.extra_price;
}

function calculate(){
  var weight = parseFloat(G('weightInput').value);
  if(!weight||weight<=0){ alert('请输入有效重量'); return; }
  if(!myRates.length){ alert('暂无报价数据'); return; }
  var grid = G('resultsGrid');
  grid.style.display = 'grid';
  grid.innerHTML = myRates.map((r,i)=>{
    var price = calcPrice(r, weight);
    var extraKg = Math.max(0, weight - r.first_weight);
    var extraUnits = Math.ceil(extraKg / r.extra_unit);
    return `<div class="result-card">
      <div class="result-channel">${esc(r.channel)}</div>
      <div class="result-price">¥${price.toFixed(0)}<span> / ${weight}kg</span></div>
      <div class="result-days">预计 ${r.days_min}–${r.days_max} 工作日</div>
      <div class="result-detail">
        首重 ${r.first_weight}kg = ¥${r.first_price}<br>
        ${extraKg>0?`续重 ${extraUnits}×${r.extra_unit}kg×¥${r.extra_price} = ¥${(extraUnits*r.extra_price).toFixed(0)}`:'（在首重范围内）'}
      </div>
    </div>`;
  }).join('');
}

// ── 导出Excel ──
function exportExcel(){
  if(!window.XLSX){alert('Excel库加载中，请稍后再试');return;}
  var data=allOrders.map(o=>({
    '订单号':o.orderId||o.id,
    '货物':o.goods||'',
    '渠道':o.channel||'',
    '目的国':o.destCountry||o.country||'',
    '邮编':o.zip||'',
    '运单号':o.trackingNumber||'',
    '状态':o.status||'待处理',
    '最新动态':o.lastStatus||'',
    '申报价值':(o.amount||'')+' '+(o.currency||'USD'),
    '数量':o.qty||'',
    '备注':o.remarks||'',
    '下单时间':o.submitTime||(o.createdAt?.toDate?.()?.toLocaleString('zh-CN')||'')
  }));
  var ws=XLSX.utils.json_to_sheet(data);
  ws['!cols']=[20,20,14,14,8,18,8,24,14,6,16,18].map(w=>({wch:w}));
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'我的订单');
  XLSX.writeFile(wb,'BKD我的订单_'+new Date().toLocaleDateString('zh-CN').replace(/\//g,'')+'.xlsx');
}
</script>
