<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BKD Admin — 保凯达后台</title>
<style>
:root {
  --blue:#1a56db;--teal:#0d9488;--red:#dc2626;--amber:#d97706;
  --bg:#e8f1fb;--card:#ffffff;--border:#cfe0f5;--text:#0f172a;--muted:#64748b;
  --sb-bg:#e8f0fe;--sb-border:#c5d8f8;--sb-text:#1e3a6e;--sb-muted:#5a7bbf;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0f2057 0%,#1a56db 100%);position:fixed;inset:0;z-index:100;}
.login-box{background:#fff;border-radius:18px;padding:36px 32px;width:330px;text-align:center;box-shadow:0 24px 60px rgba(15,32,87,.3);}
.login-logo{width:52px;height:52px;background:linear-gradient(135deg,var(--blue),var(--teal));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;margin:0 auto 16px;}
.login-box h2{color:#0f172a;font-size:18px;font-weight:700;margin-bottom:3px;}
.login-box p{color:#94a3b8;font-size:11px;margin-bottom:24px;}
.login-box input{width:100%;padding:10px 13px;background:#f8faff;border:1.5px solid #dce6f5;border-radius:9px;color:#0f172a;font-size:13px;outline:none;margin-bottom:10px;}
.login-box input:focus{border-color:var(--blue);background:#fff;}
.login-box input::placeholder{color:#94a3b8;}
.btn-login{width:100%;padding:11px;background:linear-gradient(135deg,var(--blue),#1d4ed8);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-login:hover{opacity:.9;}
.login-err{color:#dc2626;font-size:11px;margin-top:6px;display:none;}

/* LAYOUT */
#app{display:none;}
.sidebar{width:208px;background:var(--sb-bg);border-right:1px solid var(--sb-border);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50;}
.sb-logo{padding:15px 15px 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--sb-border);}
.sb-logo img{height:30px;border-radius:6px;}
.sb-logo .lt{color:var(--sb-text);font-size:13px;font-weight:700;line-height:1.2;}
.sb-logo .ls{color:var(--sb-muted);font-size:9px;margin-top:1px;}
.sb-nav{flex:1;padding:7px 0;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 15px;color:var(--sb-text);font-size:12px;font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:all .12s;margin:1px 0;}
.nav-item:hover{background:#d4e4fc;color:var(--blue);}
.nav-item.active{color:#fff;background:var(--blue);border-left-color:#fff;border-radius:0 8px 8px 0;margin-right:8px;}
.nav-icon{font-size:14px;width:17px;text-align:center;flex-shrink:0;}
.sb-footer{padding:10px 15px;border-top:1px solid var(--sb-border);}
.sb-footer button{background:none;border:none;color:var(--sb-muted);font-size:11px;cursor:pointer;}
.sb-footer button:hover{color:var(--sb-text);}

.main{margin-left:208px;min-height:100vh;}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 22px;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;box-shadow:0 1px 4px rgba(26,86,219,.06);}
.topbar-title{font-size:14px;font-weight:700;color:#0f172a;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.badge-admin{background:#dbeafe;color:#1e40af;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;}
.refresh-btn{background:none;border:1.5px solid var(--border);border-radius:7px;padding:5px 11px;font-size:11px;cursor:pointer;color:var(--muted);}
.refresh-btn:hover{border-color:var(--blue);color:var(--blue);}

.content{padding:16px 20px;}
.page{display:none;}
.page.active{display:block;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 15px;}
.stat-label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.stat-val{font-size:24px;font-weight:700;color:#0f172a;}
.stat-sub{font-size:10px;color:var(--muted);margin-top:2px;}

/* TABLE CARD */
.table-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.table-header{padding:10px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.table-header h3{font-size:13px;font-weight:700;color:#0f172a;}
.search-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.search-bar input{padding:5px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;outline:none;width:170px;}
.search-bar input:focus{border-color:var(--blue);}

/* BUTTONS */
.btn{padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:opacity .12s;line-height:1.5;}
.btn:hover{opacity:.85;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text);}
.btn-sm{padding:3px 8px;font-size:11px;}
.btn-danger{background:var(--red);color:#fff;}
.btn-del{background:none;border:1.5px solid #fca5a5;color:#fca5a5;padding:3px 7px;font-size:10px;border-radius:5px;cursor:pointer;transition:all .12s;font-weight:700;line-height:1;}
.btn-del:hover{background:var(--red);border-color:var(--red);color:#fff;}
#batchDeleteBtn{display:none;background:var(--red);color:#fff;border:none;padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;align-items:center;gap:4px;}
#batchDeleteBtn.visible{display:inline-flex;}

/* TABLE */
table{width:100%;border-collapse:collapse;}
th{background:#deeaf8;padding:7px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
td{padding:7px 10px;font-size:12px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafbff;}
td.td-idx{color:var(--muted);font-size:10px;font-weight:600;text-align:center;width:28px;padding:7px 4px;}
td.td-doc{white-space:nowrap;min-width:82px;}
td.td-doc{white-space:nowrap;min-width:80px;}
th.th-idx{text-align:center;width:28px;padding:7px 4px;}
th.th-chk,td.td-chk{width:28px;text-align:center;padding:7px 4px;}
input[type=checkbox]{width:13px;height:13px;accent-color:var(--blue);cursor:pointer;}

.order-id{font-family:monospace;font-weight:700;color:var(--blue);font-size:11px;}
.status-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
.s-pending{background:#fef3c7;color:#92400e;}
.s-transit{background:#dbeafe;color:#1e40af;}
.s-delivered{background:#dcfce7;color:#166534;}
.s-exception{background:#fee2e2;color:#991b1b;}

/* SF 内联 */
.sf-wrap{display:flex;align-items:center;gap:3px;}
.sf-inline{font-family:monospace;font-size:11px;padding:3px 6px;border:1.5px solid #fed7aa;border-radius:5px;width:108px;outline:none;background:#fff7ed;color:#c2410c;}
.sf-inline:focus{border-color:#f97316;background:#fff;}
.sf-inline::placeholder{color:#fdba74;font-size:10px;}
.sf-save-btn{padding:3px 6px;font-size:10px;font-weight:700;background:#f97316;color:#fff;border:none;border-radius:4px;cursor:pointer;flex-shrink:0;}
.sf-save-btn:hover{background:#ea580c;}
.sf-badge{display:inline-block;background:#fff7ed;border:1px solid #fed7aa;color:#c2410c;border-radius:4px;font-size:10px;font-weight:700;padding:2px 6px;font-family:monospace;}
td.td-doc{white-space:nowrap;min-width:80px;}
.doc-upload-label:hover{text-decoration:underline;}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;}
.overlay.on{display:flex;}
.modal{background:#fff;border-radius:12px;width:min(94vw,510px);box-shadow:0 20px 60px rgba(0,0,0,.16);}
.modal-head{padding:13px 17px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-size:13px;font-weight:700;}
.modal-close{background:none;border:none;font-size:17px;cursor:pointer;color:var(--muted);padding:2px 6px;}
.modal-body{padding:14px 17px;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.field input,.field select,.field textarea{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;color:var(--text);outline:none;font-family:inherit;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}
.field textarea{resize:vertical;min-height:52px;}
.modal-foot{padding:10px 17px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:6px;}

/* TRACKING */
.track-timeline{margin-top:10px;}
.track-item{display:flex;gap:11px;padding:7px 0;border-bottom:1px solid #f1f5f9;}
.track-item:last-child{border-bottom:none;}
.track-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:3px;}
.track-dot.latest{background:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.15);}
.track-time{font-size:10px;color:var(--muted);white-space:nowrap;}
.track-desc{font-size:12px;color:var(--text);}

/* MISC */
.loading{text-align:center;padding:30px;color:var(--muted);font-size:12px;}
.spin{display:inline-block;width:13px;height:13px;border:2px solid #e2e8f0;border-top-color:var(--blue);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:5px;}
@keyframes sp{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:36px 0;color:var(--muted);}
.empty-icon{font-size:28px;margin-bottom:8px;}
.empty p{font-size:12px;}
.alert{padding:7px 11px;border-radius:7px;font-size:11px;margin-bottom:10px;display:none;}
.alert-ok{background:#f0fdf4;border:1px solid #86efac;color:#166534;}
.alert-err{background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;}
.confirm-icon{font-size:26px;text-align:center;margin-bottom:7px;}
.confirm-msg{font-size:12px;line-height:1.7;color:var(--text);text-align:center;}
.confirm-sub{font-size:10px;color:var(--muted);text-align:center;margin-top:4px;}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform .2s;}
  .main{margin-left:0;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .content{padding:12px;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">B</div>
    <h2>BKD 后台管理</h2>
    <p>保凯达·霖霖 国际物流 Admin</p>
    <input type="password" id="pwInput" placeholder="管理员密码" autocomplete="current-password">
    <button class="btn-login" id="loginBtn">登 录</button>
    <div class="login-err" id="loginErr">密码错误，请重试</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sidebar">
    <div class="sb-logo">
      <img src="logo.png" onerror="this.style.display='none'">
      <div><div class="lt">BKD Admin</div><div class="ls">保凯达·霖霖</div></div>
    </div>
    <nav class="sb-nav">
      <div class="nav-item active" data-page="orders"><span class="nav-icon">📦</span>订单管理</div>
      <div class="nav-item" data-page="tracking"><span class="nav-icon">🔍</span>物流查询</div>
      <div class="nav-item" data-page="stats"><span class="nav-icon">📊</span>数据统计</div>
    </nav>
    <div class="sb-footer"><button id="logoutBtn">⬅ 退出登录</button></div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="pageTitle">订单管理</div>
      <div class="topbar-right">
        <span class="badge-admin">管理员</span>
        <button class="refresh-btn" id="refreshBtn">↻ 刷新</button>
      </div>
    </div>

    <div class="content">

      <!-- 订单管理 -->
      <div class="page active" id="page-orders">
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-label">总订单</div><div class="stat-val" id="s-total">—</div><div class="stat-sub">全部</div></div>
          <div class="stat-card"><div class="stat-label">待处理</div><div class="stat-val" id="s-pending">—</div><div class="stat-sub">未录运单</div></div>
          <div class="stat-card"><div class="stat-label">运输中</div><div class="stat-val" id="s-transit">—</div><div class="stat-sub">已录单号</div></div>
          <div class="stat-card"><div class="stat-label">已签收</div><div class="stat-val" id="s-delivered">—</div><div class="stat-sub">完成</div></div>
        </div>
        <div class="table-card">
          <div class="table-header">
            <h3>所有订单</h3>
            <div class="search-bar">
              <input type="text" id="searchInput" placeholder="搜索订单 / 客户 / 货物…">
              <button id="batchDeleteBtn" title="批量删除选中">🗑 批量删除&nbsp;(<span id="batchCount">0</span>)</button>
              <button class="btn btn-teal" id="exportBtn">⬇ 导出</button>
            </div>
          </div>
          <!-- 筛选条 -->
          <div id="filterBar" style="padding:8px 15px;border-bottom:1px solid var(--border);background:#f4f9ff;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;">筛选：</span>
            <select id="filterStatus" style="padding:4px 9px;font-size:11px;border:1.5px solid var(--border);border-radius:6px;outline:none;background:#fff;color:var(--text);cursor:pointer;">
              <option value="">全部状态</option>
              <option value="待处理">待处理</option>
              <option value="运输中">运输中</option>
              <option value="已签收">已签收</option>
              <option value="异常">异常</option>
            </select>
            <select id="filterChannel" style="padding:4px 9px;font-size:11px;border:1.5px solid var(--border);border-radius:6px;outline:none;background:#fff;color:var(--text);cursor:pointer;min-width:100px;">
              <option value="">全部渠道</option>
            </select>
            <div style="display:flex;align-items:center;gap:4px;">
              <input type="date" id="filterDateFrom" style="padding:4px 8px;font-size:11px;border:1.5px solid var(--border);border-radius:6px;outline:none;background:#fff;color:var(--text);">
              <span style="font-size:10px;color:var(--muted);">至</span>
              <input type="date" id="filterDateTo" style="padding:4px 8px;font-size:11px;border:1.5px solid var(--border);border-radius:6px;outline:none;background:#fff;color:var(--text);">
            </div>
            <button id="filterResetBtn" style="padding:4px 10px;font-size:11px;font-weight:700;border:1.5px solid var(--border);border-radius:6px;background:#fff;color:var(--muted);cursor:pointer;">✕ 重置</button>
            <span id="filterHint" style="font-size:10px;color:var(--blue);font-weight:600;margin-left:2px;"></span>
          </div>
          <div id="ordersTableWrap"><div class="loading"><span class="spin"></span>加载中…</div></div>
        </div>
      </div>

      <!-- 物流查询 -->
      <div class="page" id="page-tracking">
        <div class="table-card">
          <div class="table-header"><h3>手动查询运单</h3></div>
          <div style="padding:15px;">
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
              <div class="field" style="margin:0;flex:1;min-width:130px;">
                <label>快递公司</label>
                <select id="manualCarrier">
                  <option value="auto">自动识别</option>
                  <option value="dhl">DHL</option><option value="fedex">FedEx</option>
                  <option value="ups">UPS</option><option value="usps">USPS</option>
                  <option value="aramex">Aramex</option><option value="cdek">CDEK</option>
                </select>
              </div>
              <div class="field" style="margin:0;flex:2;min-width:170px;">
                <label>运单号</label>
                <input type="text" id="manualTrackNum" placeholder="输入运单号…" style="font-family:monospace;">
              </div>
              <button class="btn btn-primary" id="manualQueryBtn" style="height:33px;">查 询</button>
            </div>
            <div id="trackResult" style="margin-top:12px;"></div>
          </div>
        </div>
      </div>

      <!-- 数据统计 -->
      <div class="page" id="page-stats">
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
          <div class="stat-card"><div class="stat-label">本月订单</div><div class="stat-val" id="ss-month">—</div></div>
          <div class="stat-card"><div class="stat-label">最常用渠道</div><div class="stat-val" id="ss-channel" style="font-size:15px;margin-top:2px;">—</div></div>
          <div class="stat-card"><div class="stat-label">目的地Top1</div><div class="stat-val" id="ss-country" style="font-size:15px;margin-top:2px;">—</div></div>
        </div>
        <div class="table-card">
          <div class="table-header"><h3>渠道分布</h3></div>
          <div id="channelStats" style="padding:12px 15px;"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- 录入运单号 Modal -->
<div class="overlay" id="trackModal">
  <div class="modal">
    <div class="modal-head"><h3>📦 录入运单号</h3><button class="modal-close" id="trackModalClose">✕</button></div>
    <div class="modal-body">
      <div id="trackModalAlert" class="alert"></div>
      <div style="background:#f4f8ff;border:1px solid var(--border);border-radius:7px;padding:9px 12px;margin-bottom:12px;font-size:11px;line-height:1.9;">
        <div><span style="color:var(--muted);">订单：</span><strong id="tm-orderId" style="font-family:monospace;"></strong></div>
        <div><span style="color:var(--muted);">客户：</span><strong id="tm-company"></strong></div>
        <div><span style="color:var(--muted);">货物：</span><span id="tm-goods"></span></div>
        <div><span style="color:var(--muted);">渠道：</span><span id="tm-channel"></span></div>
      </div>
      <div class="field">
        <label>快递公司</label>
        <select id="tm-carrier">
          <option value="auto">自动识别</option><option value="dhl">DHL</option>
          <option value="fedex">FedEx</option><option value="ups">UPS</option>
          <option value="usps">USPS</option><option value="aramex">Aramex</option>
          <option value="cdek">CDEK</option><option value="ems">EMS</option>
        </select>
      </div>
      <div class="field">
        <label>运单号 Tracking Number</label>
        <input type="text" id="tm-trackingNum" placeholder="粘贴快递运单号…" style="font-family:monospace;font-size:13px;">
      </div>
      <div class="field">
        <label>顺丰单号 SF Express No.</label>
        <input type="text" id="tm-sfNo-edit" placeholder="顺丰快递单号（如有，可更新）" style="font-family:monospace;font-size:13px;">
      </div>
      <div class="field">
        <label>目的国</label>
        <input type="text" id="tm-country" placeholder="如：United States / 美国">
      </div>
      <div class="field">
        <label>备注</label>
        <textarea id="tm-note" placeholder="如：拆分两票，第一票…"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" id="trackModalCancel">取消</button>
      <button class="btn btn-teal" id="trackModalSave">保存</button>
    </div>
  </div>
</div>

<!-- 详情/编辑 Modal -->
<div class="overlay" id="detailModal">
  <div class="modal" style="width:min(94vw,590px);">
    <div class="modal-head">
      <h3 id="detail-title">订单详情</h3>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="btn btn-teal btn-sm" id="editToggleBtn">✏️ 编辑</button>
        <button class="modal-close" id="detailClose">✕</button>
      </div>
    </div>
    <div class="modal-body" id="detailBody" style="max-height:68vh;overflow-y:auto;"></div>
    <div class="modal-foot" id="detailFoot" style="display:none;">
      <button class="btn btn-outline" id="editCancelBtn">取消</button>
      <button class="btn btn-teal" id="editSaveBtn">保存修改</button>
    </div>
  </div>
</div>

<!-- 删除确认 Modal -->
<div class="overlay" id="confirmModal">
  <div class="modal" style="width:min(92vw,370px);">
    <div class="modal-head">
      <h3 id="confirmTitle">确认删除</h3>
      <button class="modal-close" id="confirmClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="confirm-icon">🗑️</div>

async function loadOrders(){

      if(!match)return false;
    }
    // 状态筛选
    if(fStatus&&(o.status||'待处理')!==fStatus)return false;
    // 渠道筛选
    if(fChannel&&(o.channel||'')!==fChannel)return false;
    // 日期筛选
    if(fFrom||fTo){
      var dt=null;
      if(o.createdAt&&o.createdAt.toDate)dt=o.createdAt.toDate();
      else if(o.submitTime)dt=new Date(o.submitTime);
      if(!dt)return !(fFrom||fTo);
      var ds=dt.toISOString().slice(0,10);

      <td class="td-doc">
        ${o.docUrl
          ? `<a href="${esc(o.docUrl)}" target="_blank" style="font-size:11px;color:var(--teal);font-weight:700;text-decoration:none;">📄 下载</a>

        }

      <td class="td-doc">
        ${o.invoiceUrl
          ? `<a href="${esc(o.invoiceUrl)}" target="_blank" style="font-size:11px;color:#c2410c;font-weight:700;text-decoration:none;">📋 下载</a>
             <button class="inv-del-btn" data-inv-id="${o.id}" data-inv-path="${esc(o.invoicePath||'')}" style="margin-left:4px;background:none;border:none;color:#fca5a5;cursor:pointer;font-size:12px;" title="删除发票">✕</button>`
          : `<label class="inv-upload-label" data-inv-id="${o.id}" style="cursor:pointer;font-size:11px;color:#c2410c;font-weight:600;">⬆ 上传<input type="file" accept=".png,.jpg,.jpeg,.pdf,.xlsx,.xls" style="display:none;" class="inv-file-input" data-inv-id="${o.id}"></label>`

          <input type="number" class="tax-amt" data-tax-id="${o.id}" value="${esc(String(o.taxAmount||''))}" placeholder="金额¥" min="0" step="0.01"
            style="width:80px;padding:3px 6px;font-size:11px;border:1.5px solid #fed7aa;border-radius:5px;outline:none;background:#fff7ed;color:#c2410c;display:${o.taxPaid?'block':'none'};">
        </div>
      </td>
      <td><span class="status-badge ${sc}">${esc(st)}</span></td>
      <td style="font-size:10px;color:var(--muted);white-space:nowrap;">${dt}</td>
      <td style="white-space:nowrap;">
        <button class="btn btn-teal btn-sm" data-action="track" data-id="${o.id}">录运单</button>

        <button class="btn-del" data-action="delete" data-id="${o.id}" style="margin-left:2px;" title="删除">🗑</button>
      </td></tr>`;
  }).join('');

  var allChk=list.length>0&&list.every(o=>selectedIds.has(o.id));
  G('ordersTableWrap').innerHTML=`<div style="overflow-x:auto;"><table>
    <thead><tr>
      <th class="th-chk"><input type="checkbox" id="selectAll" ${allChk?'checked':''}></th>
      <th class="th-idx">#</th>
      <th>订单号</th><th>客户/邮箱</th><th>货物</th><th>渠道</th>
      <th>运单号</th><th>顺丰单号</th><th>状态</th><th>下单时间</th><th>操作</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;

  G('selectAll').addEventListener('change',function(){
    list.forEach(o=>{if(this.checked)selectedIds.add(o.id);else selectedIds.delete(o.id);});
    updateBatchBtn();
    G('ordersTableWrap').querySelectorAll('.row-chk').forEach(c=>c.checked=this.checked);
  });
  G('ordersTableWrap').querySelectorAll('.row-chk').forEach(c=>{
    c.addEventListener('change',function(){
      if(this.checked)selectedIds.add(this.dataset.id);else selectedIds.delete(this.dataset.id);
      updateBatchBtn();
    });
  });
  G('ordersTableWrap').querySelectorAll('[data-sf-save]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      var id=btn.dataset.sfSave;

      btn.textContent='…';btn.disabled=true;
      try{
        var{doc,updateDoc}=window._bkdFS;
        await updateDoc(doc(window._bkdDB,'orders',id),{sfNo:val,updatedAt:new Date().toISOString()});
        var ix=allOrders.findIndex(x=>x.id===id);if(ix>=0)allOrders[ix].sfNo=val;
        btn.textContent='✓';setTimeout(()=>renderTable(),700);
      }catch(e){btn.textContent='✗';alert('失败:'+e.message);}
    });
  });
  // 运单文件上传
  G('ordersTableWrap').querySelectorAll('.doc-file-input').forEach(inp=>{
    inp.addEventListener('change',async()=>{
      var file=inp.files[0];if(!file)return;
      var id=inp.dataset.uploadId;
      var label=G('ordersTableWrap').querySelector('.doc-upload-label[data-upload-id="'+id+'"]');
      if(label)label.textContent='上传中…';
      try{
        var{ref,uploadBytes,getDownloadURL}=window._bkdStorageRef;
        var st=window._bkdStorage;
        var path='waybills/'+id+'/'+file.name;
        var sRef=ref(st,path);
        await uploadBytes(sRef,file);
        var url=await getDownloadURL(sRef);
        var{doc,updateDoc}=window._bkdFS;
        await updateDoc(doc(window._bkdDB,'orders',id),{docUrl:url,docPath:path,updatedAt:new Date().toISOString()});
        var ix=allOrders.findIndex(x=>x.id===id);
        if(ix>=0){allOrders[ix].docUrl=url;allOrders[ix].docPath=path;}
        renderTable();
      }catch(e){alert('上传失败：'+e.message);if(label)label.textContent='⬆ 上传';}
    });
  });
  // 运单文件删除
  G('ordersTableWrap').querySelectorAll('.doc-del-btn').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      if(!confirm('确认删除该运单文件？'))return;
      var id=btn.dataset.docId,path=btn.dataset.docPath;
      try{
        if(path){
          var{ref,deleteObject}=window._bkdStorageRef;
          await deleteObject(ref(window._bkdStorage,path)).catch(()=>{});

        var{doc,updateDoc}=window._bkdFS;
        await updateDoc(doc(window._bkdDB,'orders',id),{docUrl:'',docPath:'',updatedAt:new Date().toISOString()});

        renderTable();
      }catch(e){alert('删除失败：'+e.message);}

    inp.addEventListener('blur',async()=>{
      var id=inp.dataset.taxId;

        if(ix>=0)allOrders[ix].taxAmount=val;
      }catch(e){alert('保存失败：'+e.message);}

  G('ordersTableWrap').querySelectorAll('[data-action]').forEach(btn=>{

var cur=null;
function initTrackModal(){
  G('trackModalClose').addEventListener('click',()=>closeModal('trackModal'));
  G('trackModalCancel').addEventListener('click',()=>closeModal('trackModal'));
  G('trackModal').addEventListener('click',e=>{if(e.target===G('trackModal'))closeModal('trackModal');});

}
function openTrackModal(o){
  cur=o;
  G('tm-orderId').textContent=o.orderId||o.id;G('tm-company').textContent=o.senderCompany||'—';
  G('tm-goods').textContent=o.goods||'—';G('tm-channel').textContent=o.channel||'—';
  G('tm-trackingNum').value=o.trackingNumber||'';G('tm-carrier').value=o.carrier||'auto';
  G('tm-sfNo-edit').value=o.sfNo||'';
  G('tm-country').value=o.destCountry||o.country||'';G('tm-note').value=o.adminNote||'';
  G('trackModalAlert').style.display='none';openModal('trackModal');
  setTimeout(()=>G('tm-trackingNum').focus(),100);
}
async function saveTracking(){
  var tn=(G('tm-trackingNum').value||'').trim();
  if(!tn){showAlert('trackModalAlert','err','请填写运单号');return;}
  var btn=G('trackModalSave');btn.disabled=true;btn.textContent='保存…';
  try{
    var{doc,updateDoc}=window._bkdFS;
    var sf=G('tm-sfNo-edit').value.trim();
    await updateDoc(doc(window._bkdDB,'orders',cur.id),{
      trackingNumber:tn,carrier:G('tm-carrier').value,sfNo:sf||cur.sfNo||'',
      destCountry:G('tm-country').value,adminNote:G('tm-note').value,
      status:'运输中',updatedAt:new Date().toISOString()
    });
    var ix=allOrders.findIndex(x=>x.id===cur.id);
    if(ix>=0)Object.assign(allOrders[ix],{trackingNumber:tn,carrier:G('tm-carrier').value,sfNo:sf||allOrders[ix].sfNo||'',status:'运输中'});
    renderTable();updateStats();closeModal('trackModal');
  }catch(e){showAlert('trackModalAlert','err','保存失败：'+e.message);}
  btn.disabled=false;btn.textContent='保存';
}

  var flds=[['订单号',o.orderId||o.id],['客户',o.senderCompany],['邮箱',o.email],['时间',dt],
    ['渠道',o.channel],['货物',o.goods],['数量',o.qty],['申报总价',o.amount+' '+(o.currency||'USD')],
    ['HS Code',o.hsCode||'—'],['特殊货物',o.special||'—'],['顺丰单号',o.sfNo||'—'],
    ['目的地',o.country+(o.city?'·'+o.city:'')],['邮编',o.zip],['目的国',o.destCountry||'—'],
    ['运单号',o.trackingNumber||'未录入'],['快递公司',o.carrier||'—'],
    ['状态',o.status||'待处理'],['关税垫付',o.taxPaid?'✅ 已垫付':'—'],['关税金额',o.taxAmount?('¥'+o.taxAmount):'—'],['备注',o.remarks||'—'],['收件地址',o.address||'—']];
  G('detailBody').innerHTML=flds.map(([k,v])=>`<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:12px;"><span style="color:var(--muted);min-width:72px;flex-shrink:0;font-size:11px;">${esc(k)}</span><span style="word-break:break-all;">${esc(v||'—')}</span></div>`).join('');
  openModal('detailModal');
}
function renderDetailEdit(o){
  G('detail-title').textContent='编辑 — '+(o.orderId||o.id);
  G('editToggleBtn').style.display='none';G('detailFoot').style.display='flex';
  var ef=[['senderCompany','客户名','text',o.senderCompany],['email','邮箱','email',o.email],
    ['channel','渠道','text',o.channel],['goods','货物','text',o.goods],
    ['qty','数量','text',o.qty],['currency','货币','text',o.currency||'USD'],
    ['hsCode','HS Code','text',o.hsCode],['sfNo','顺丰单号','text',o.sfNo],
    ['country','目的国家','text',o.country],['zip','邮编','text',o.zip],
    ['trackingNumber','运单号','text',o.trackingNumber],['carrier','快递公司','text',o.carrier],
    ['status','状态','select',o.status],['remarks','备注','textarea',o.remarks],
    ['address','收件地址','textarea',o.address]];
  G('detailBody').innerHTML=ef.map(([id,lb,tp,v])=>{
    var inp=tp==='textarea'?`<textarea id="ef-${id}" style="width:100%;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:11px;font-family:inherit;min-height:48px;outline:none;">${esc(v||'')}</textarea>`:
    tp==='select'?`<select id="ef-${id}" style="width:100%;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:11px;outline:none;">${['待处理','运输中','已签收','异常'].map(s=>`<option${s===v?' selected':''}>${s}</option>`).join('')}</select>`:
    `<input type="${tp}" id="ef-${id}" value="${esc(v||'')}" style="width:100%;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:11px;outline:none;">`;
    return`<div style="padding:4px 0;border-bottom:1px solid #f1f5f9;"><div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;">${lb}</div>${inp}</div>`;
  }).join('');
}
async function saveDetailEdit(){
  var btn=G('editSaveBtn');btn.disabled=true;btn.textContent='保存…';
  try{
    var{doc,updateDoc}=window._bkdFS;
    var u={senderCompany:G('ef-senderCompany').value,email:G('ef-email').value,channel:G('ef-channel').value,goods:G('ef-goods').value,qty:G('ef-qty').value,currency:G('ef-currency').value,hsCode:G('ef-hsCode').value,sfNo:G('ef-sfNo').value,country:G('ef-country').value,zip:G('ef-zip').value,trackingNumber:G('ef-trackingNumber').value,carrier:G('ef-carrier').value,status:G('ef-status').value,remarks:G('ef-remarks').value,address:G('ef-address').value,updatedAt:new Date().toISOString()};
    await updateDoc(doc(window._bkdDB,'orders',cur.id),u);
    var ix=allOrders.findIndex(x=>x.id===cur.id);
    if(ix>=0)allOrders[ix]=Object.assign({},allOrders[ix],u);
    cur=allOrders[ix];renderTable();updateStats();isEdit=false;openDetailModal(cur);
  }catch(e){alert('保存失败：'+e.message);}
  btn.disabled=false;btn.textContent='保存修改';
}

/* ── 删除 ── */
function initConfirmModal(){
  G('confirmClose').addEventListener('click',()=>{pendingDeleteIds=[];closeModal('confirmModal');});
  G('confirmCancel').addEventListener('click',()=>{pendingDeleteIds=[];closeModal('confirmModal');});
  G('confirmModal').addEventListener('click',e=>{if(e.target===G('confirmModal')){pendingDeleteIds=[];closeModal('confirmModal');}});
  G('confirmOk').addEventListener('click',doDelete);
}
function openSingleDelete(o){
  pendingDeleteIds=[o.id];
  G('confirmTitle').textContent='确认删除';
  G('confirmMsg').textContent='确定要删除这条订单吗？';
  G('confirm-sub').textContent='订单：'+(o.orderId||o.id)+'　客户：'+(o.senderCompany||'—');
  G('confirmAlert').style.display='none';openModal('confirmModal');
}
function openBatchDelete(){
  if(!selectedIds.size)return;
  pendingDeleteIds=[...selectedIds];
  G('confirmTitle').textContent='批量删除';
  G('confirmMsg').textContent='确定删除选中的 '+pendingDeleteIds.length+' 条订单？';
  G('confirm-sub').textContent='此操作不可撤销。';
  G('confirmAlert').style.display='none';openModal('confirmModal');
}
async function doDelete(){
  if(!pendingDeleteIds.length)return;
  var btn=G('confirmOk');btn.disabled=true;btn.textContent='删除中…';
  try{
    var{doc,deleteDoc,writeBatch}=window._bkdFS,db=window._bkdDB;
    if(pendingDeleteIds.length===1){
      await deleteDoc(doc(db,'orders',pendingDeleteIds[0]));
    } else {
      for(var i=0;i<pendingDeleteIds.length;i+=400){
        var b=writeBatch(db);
        pendingDeleteIds.slice(i,i+400).forEach(id=>b.delete(doc(db,'orders',id)));
        await b.commit();
      }
    }
    var del=new Set(pendingDeleteIds);
    allOrders=allOrders.filter(o=>!del.has(o.id));
    del.forEach(id=>selectedIds.delete(id));
    pendingDeleteIds=[];renderTable();updateStats();updateBatchBtn();closeModal('confirmModal');
  }catch(e){showAlert('confirmAlert','err','删除失败：'+e.message);}
  btn.disabled=false;btn.textContent='确认删除';
}

/* ── 查询 ── */
async function manualQuery(){
  var num=(G('manualTrackNum').value||'').trim();
  if(!num){alert('请输入运单号');return;}
  var btn=G('manualQueryBtn');btn.disabled=true;btn.textContent='查询…';
  G('trackResult').innerHTML='<div class="loading"><span class="spin"></span>查询中…</div>';
  try{
    var r=await fetch(WORKER+'?carrier='+encodeURIComponent(G('manualCarrier').value)+'&num='+encodeURIComponent(num));
    renderTrackResult(await r.json(),num);
  }catch(e){G('trackResult').innerHTML='<div style="color:var(--red);font-size:12px;">查询失败：'+e.message+'</div>';}
  btn.disabled=false;btn.textContent='查 询';
}
function renderTrackResult(d,num){
  if(!d||d.returnCode==='500'||(!d.data&&!d.traces)){G('trackResult').innerHTML='<div style="color:var(--amber);font-size:12px;padding:9px;background:#fffbeb;border-radius:7px;border:1px solid #fde68a;">⚠ 未查到该运单。</div>';return;}
  var traces=d.data||d.traces||[];
  if(!traces.length){G('trackResult').innerHTML='<div style="color:var(--muted);font-size:12px;">暂无轨迹</div>';return;}
  var sm={'0':'待揽件','1':'已揽件','2':'运输中','3':'已签收','4':'问题件'};
  var items=traces.map((t,i)=>`<div class="track-item"><div class="track-dot ${i===0?'latest':''}"></div><div style="flex:1;"><div class="track-desc">${esc(t.context||t.desc||'')}</div><div class="track-time">${esc(t.time||t.ftime||'')}</div></div></div>`).join('');
  G('trackResult').innerHTML=`<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:7px;padding:7px 11px;margin-bottom:9px;font-size:11px;">✓ <strong style="font-family:monospace;">${esc(num)}</strong>　${sm[d.state||'']||'运输中'}</div><div class="track-timeline">${items}</div>`;
}

/* ── 统计 ── */
function renderStats(){
  var now=new Date();
  G('ss-month').textContent=allOrders.filter(o=>{var d=o.createdAt?.toDate?.()||(o.submitTime?new Date(o.submitTime):null);return d&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}).length;
  var ch={};allOrders.forEach(o=>{var c=o.channel||'未知';ch[c]=(ch[c]||0)+1;});
  var tc=Object.entries(ch).sort((a,b)=>b[1]-a[1]);
  G('ss-channel').textContent=tc[0]?tc[0][0].slice(0,12):'—';
  var co={};allOrders.forEach(o=>{var c=o.country||'未知';co[c]=(co[c]||0)+1;});
  var tc2=Object.entries(co).sort((a,b)=>b[1]-a[1]);
  G('ss-country').textContent=tc2[0]?tc2[0][0]:'—';
  G('channelStats').innerHTML=tc.map(([c,n])=>`<div style="display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid #f1f5f9;"><span style="font-size:12px;min-width:120px;">${esc(c)}</span><div style="flex:1;background:#f1f5f9;border-radius:3px;height:6px;overflow:hidden;"><div style="width:${Math.round(n/allOrders.length*100)}%;height:100%;background:var(--blue);border-radius:3px;"></div></div><span style="font-size:11px;color:var(--muted);min-width:32px;text-align:right;">${n}票</span></div>`).join('')||'<div style="color:var(--muted);font-size:12px;">暂无</div>';
}

/* ── 导出 ── */
function exportExcel(){
  if(!window.XLSX){alert('XLSX加载中');return;}
  var data=allOrders.map((o,i)=>{var dt='';if(o.createdAt&&o.createdAt.toDate)dt=o.createdAt.toDate().toLocaleString('zh-CN');else if(o.submitTime)dt=o.submitTime.replace('T',' ').slice(0,16);return{'序号':i+1,'订单号':o.orderId||o.id,'客户':o.senderCompany||'','邮箱':o.email||'','时间':dt,'渠道':o.channel||'','货物':o.goods||'','数量':o.qty||'','申报价值':(o.amount||'')+' '+(o.currency||'USD'),'目的国':o.country||'','邮编':o.zip||'','顺丰单号':o.sfNo||'','运单号':o.trackingNumber||'','状态':o.status||'待处理','关税垫付':o.taxPaid?'是':'','关税金额':o.taxAmount||'','备注':o.remarks||''};});
  var ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'订单');
  ws['!cols']=[6,20,16,22,18,14,20,6,14,12,8,14,18,8,16].map(w=>({wch:w}));
  XLSX.writeFile(wb,'BKD订单_'+new Date().toLocaleDateString('zh-CN').replace(/\//g,'')+'.xlsx');
}

/* ── 工具 ── */
function openModal(id){G(id).classList.add('on');document.body.style.overflow='hidden';}
function closeModal(id){G(id).classList.remove('on');document.body.style.overflow='';}
function showAlert(id,tp,msg){var el=G(id);el.className='alert alert-'+(tp==='err'?'err':'ok');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',4000);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
})();
</script>
