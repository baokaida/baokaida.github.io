<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BKD 管理后台</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap');
  :root{--navy:#0d1b2a;--navy2:#142233;--navy3:#1a2d44;--amber:#e8a020;--amber2:#f5b84a;--text:#d4dde8;--muted:#5a7a9a;--border:#1e3450;--success:#2ecc71;--error:#e74c3c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy);color:var(--text);font-family:'Noto Sans SC',sans-serif;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;opacity:.3;pointer-events:none;z-index:0}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  #authOverlay{position:fixed;inset:0;background:var(--navy);z-index:100;display:flex;align-items:center;justify-content:center}
  .auth-card{background:var(--navy2);border:1px solid var(--border);border-top:3px solid var(--amber);padding:44px 40px;width:380px;animation:fadeUp .4s ease}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:32px}
  .brand-box{width:32px;height:32px;background:var(--amber);display:grid;place-items:center;flex-shrink:0}
  .brand-box svg{width:18px;height:18px;fill:var(--navy)}
  .brand-name{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;letter-spacing:2px;color:#fff}
  .brand-tag{font-size:11px;color:var(--amber);letter-spacing:2px;margin-top:2px;text-transform:uppercase}
  .auth-card h2{font-size:20px;font-weight:400;color:#fff;margin-bottom:24px}
  .field-label{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;display:block}
  input[type=password],input[type=text],input[type=email],input[type=number],select{width:100%;background:var(--navy);border:1px solid var(--border);color:var(--text);padding:12px 16px;font-size:14px;font-family:'IBM Plex Mono',monospace;outline:none;transition:border-color .2s}
  input:focus,select:focus{border-color:var(--amber)}
  input::placeholder{color:var(--muted)}
  select option{background:var(--navy2)}
  .btn-primary{width:100%;margin-top:18px;padding:13px;background:var(--amber);color:var(--navy);border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:1px;transition:background .2s}
  .btn-primary:hover{background:var(--amber2)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .auth-err{margin-top:14px;padding:10px 14px;background:rgba(231,76,60,.1);border-left:3px solid var(--error);color:var(--error);font-size:13px;display:none}
  header{position:relative;z-index:1;border-bottom:1px solid var(--border);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:64px}
  .header-left{display:flex;align-items:center;gap:12px}
  .logo-icon{width:32px;height:32px;background:var(--amber);display:grid;place-items:center}
  .logo-icon svg{width:18px;height:18px;fill:var(--navy)}
  .logo-text{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;letter-spacing:2px;color:#fff}
  .admin-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--amber);border:1px solid var(--amber);padding:2px 8px;text-transform:uppercase}
  .header-right{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:16px}
  .lock-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 14px;font-size:12px;font-family:'IBM Plex Mono',monospace;cursor:pointer;transition:all .2s}
  .lock-btn:hover{border-color:var(--error);color:var(--error)}
  main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:40px}
  .tabs{display:flex;gap:0;margin-bottom:32px;border-bottom:1px solid var(--border)}
  .tab{padding:12px 24px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-family:'IBM Plex Mono',monospace}
  .tab.active{color:var(--amber);border-bottom-color:var(--amber)}
  .tab-content{display:none}
  .tab-content.active{display:block}
  .section-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:12px}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border)}
  .card{background:var(--navy2);border:1px solid var(--border);padding:24px;margin-bottom:24px;animation:fadeUp .4s ease}
  .card-title{font-size:15px;font-weight:500;color:#fff;margin-bottom:20px}
  .input-row{display:flex;gap:12px;flex-wrap:wrap}
  .input-row .field{flex:1;min-width:160px}
  .input-row .field-sm{width:100px;flex:none}
  .btn-add{padding:12px 20px;background:var(--amber);color:var(--navy);border:none;cursor:pointer;font-size:13px;font-family:'IBM Plex Mono',monospace;font-weight:600;transition:background .2s;white-space:nowrap;align-self:flex-end}
  .btn-add:hover{background:var(--amber2)}
  .btn-add:disabled{opacity:.5;cursor:not-allowed}
  .msg{margin-top:14px;font-size:13px;padding:10px 14px;display:none}
  .msg.success{display:block;background:rgba(46,204,113,.1);border-left:3px solid var(--success);color:var(--success)}
  .msg.error{display:block;background:rgba(231,76,60,.1);border-left:3px solid var(--error);color:var(--error)}
  .table-wrap{background:var(--navy2);border:1px solid var(--border);animation:fadeUp .4s .1s ease both}
  .table-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .table-header-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
  .count-badge{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--amber);background:rgba(232,160,32,.1);border:1px solid rgba(232,160,32,.3);padding:2px 10px}
  .refresh-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 12px;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;transition:all .2s}
  .refresh-btn:hover{border-color:var(--amber);color:var(--amber)}
  table{width:100%;border-collapse:collapse}
  th{padding:12px 20px;text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--navy3)}
  td{padding:13px 20px;font-size:13px;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(255,255,255,.02)}
  .td-mono{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--amber)}
  .td-muted{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
  .del-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 12px;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;transition:all .2s}
  .del-btn:hover{border-color:var(--error);color:var(--error)}
  .empty-row td{text-align:center;padding:40px;color:var(--muted);font-size:13px}
  .spinner-inline{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
  .rate-tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-family:'IBM Plex Mono',monospace;background:rgba(232,160,32,.1);color:var(--amber);border:1px solid rgba(232,160,32,.3)}
</style>
</head>
<body>

<div id="authOverlay">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-box"><svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L20 8.5v7L12 19.82 4 15.5v-7l8-4.32z"/></svg></div>
      <div><div class="brand-name">BKD</div><div class="brand-tag">管理后台</div></div>
    </div>
    <h2>身份验证</h2>
    <label class="field-label" for="adminPwd">管理员密码</label>
    <input type="password" id="adminPwd" placeholder="••••••••" autofocus>
    <button class="btn-primary" onclick="checkAdmin()">进入后台</button>
    <div class="auth-err" id="authErr">密码错误，请重试。</div>
  </div>
</div>

<header>
  <div class="header-left">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L20 8.5v7L12 19.82 4 15.5v-7l8-4.32z"/></svg></div>
    <div class="logo-text">BKD</div>
    <div class="admin-badge">Admin</div>
  </div>
  <div class="header-right">
    <span id="headerTime">—</span>
    <button class="lock-btn" onclick="lockAdmin()">锁定后台</button>
  </div>
</header>

<main>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('customers')">客户管理</div>
    <div class="tab" onclick="switchTab('rates')">报价配置</div>
  </div>

  <!-- 客户管理 -->
  <div class="tab-content active" id="tab-customers">
    <div class="section-title">添加客户</div>
    <div class="card">
      <div class="card-title">新增客户账号</div>
      <div class="input-row">
        <div class="field"><label class="field-label">客户名称</label><input type="text" id="newName" placeholder="公司/姓名"></div>
        <div class="field"><label class="field-label">邮箱地址</label><input type="email" id="newEmail" placeholder="client@company.com"></div>
        <button class="btn-add" onclick="addCustomer()">添加</button>
      </div>
      <div class="msg" id="addMsg"></div>
    </div>
    <div class="section-title">客户列表</div>
    <div class="table-wrap">
      <div class="table-header">
        <div class="table-header-title">已注册客户</div>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="count-badge" id="countBadge">0 位客户</span>
          <button class="refresh-btn" onclick="loadCustomers()">刷新</button>
        </div>
      </div>
      <table><thead><tr><th>客户名称</th><th>邮箱</th><th>注册时间</th><th>操作</th></tr></thead>
      <tbody id="customerList"><tr class="empty-row"><td colspan="4">加载中...</td></tr></tbody></table>
    </div>
  </div>

  <!-- 报价配置 -->
  <div class="tab-content" id="tab-rates">
    <div class="section-title">添加报价</div>
    <div class="card">
      <div class="card-title">为客户配置专属渠道报价</div>
      <div class="input-row">
        <div class="field"><label class="field-label">选择客户</label>
          <select id="rateCustomer"><option value="">-- 选择客户 --</option></select>
        </div>
        <div class="field"><label class="field-label">渠道名称</label><input type="text" id="rateChannel" placeholder="如 FedEx IP"></div>
      </div>
      <div class="input-row" style="margin-top:12px">
        <div class="field-sm"><label class="field-label">首重(kg)</label><input type="number" id="rateFirstWeight" value="1" step="0.5" min="0.5"></div>
        <div class="field-sm"><label class="field-label">首重价(¥)</label><input type="number" id="rateFirstPrice" placeholder="80" min="0"></div>
        <div class="field-sm"><label class="field-label">续重单位(kg)</label><input type="number" id="rateExtraUnit" value="0.5" step="0.5" min="0.5"></div>
        <div class="field-sm"><label class="field-label">续重价(¥)</label><input type="number" id="rateExtraPrice" placeholder="30" min="0"></div>
        <div class="field-sm"><label class="field-label">时效最短(天)</label><input type="number" id="rateDaysMin" value="3" min="1"></div>
        <div class="field-sm"><label class="field-label">时效最长(天)</label><input type="number" id="rateDaysMax" value="7" min="1"></div>
        <button class="btn-add" style="margin-top:22px" onclick="addRate()">添加报价</button>
      </div>
      <div class="msg" id="rateMsg"></div>
    </div>
    <div class="section-title">已配置报价</div>
    <div class="table-wrap">
      <div class="table-header">
        <div class="table-header-title">客户报价列表</div>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="count-badge" id="rateCountBadge">0 条</span>
          <button class="refresh-btn" onclick="loadRates()">刷新</button>
        </div>
      </div>
      <table><thead><tr><th>客户</th><th>渠道</th><th>首重</th><th>续重</th><th>时效</th><th>操作</th></tr></thead>
      <tbody id="rateList"><tr class="empty-row"><td colspan="6">加载中...</td></tr></tbody></table>
    </div>
  </div>
</main>

<script src="/supabase.min.js"></script>
<script>
const ADMIN_PWD = 'BKD@2026';
const sb = supabase.createClient(
  'https://zbilkisspbqzqqbhoxvv.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaWxraXNzcGJxenFxYmhveHZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MjcxNDYsImV4cCI6MjA4OTIwMzE0Nn0.IFTXWGpBNAcQQJMbQCf1qwfOkEjgDhqmDWctpQYIwFI'
);

function updateTime(){document.getElementById('headerTime').textContent=new Date().toLocaleString('zh-CN',{hour12:false});}
setInterval(updateTime,1000);updateTime();

function checkAdmin(){
  if(document.getElementById('adminPwd').value===ADMIN_PWD){
    document.getElementById('authOverlay').style.display='none';
    loadCustomers();loadRates();loadCustomerSelect();
  } else {
    document.getElementById('authErr').style.display='block';
    document.getElementById('adminPwd').value='';
  }
}
document.getElementById('adminPwd').addEventListener('keydown',e=>{if(e.key==='Enter')checkAdmin();});

function lockAdmin(){
  document.getElementById('authOverlay').style.display='flex';
  document.getElementById('adminPwd').value='';
  document.getElementById('authErr').style.display='none';
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelector(`[onclick="switchTab('${name}')"]`).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// 客户管理
async function loadCustomers(){
  const tbody=document.getElementById('customerList');
  tbody.innerHTML='<tr class="empty-row"><td colspan="4"><span class="spinner-inline"></span>加载中...</td></tr>';
  const {data,error}=await sb.from('customers').select('*').order('created_at',{ascending:false});
  if(error||!data){tbody.innerHTML=`<tr class="empty-row"><td colspan="4" style="color:var(--error)">加载失败</td></tr>`;return;}
  document.getElementById('countBadge').textContent=`${data.length} 位客户`;
  if(!data.length){tbody.innerHTML='<tr class="empty-row"><td colspan="4">暂无客户</td></tr>';return;}
  tbody.innerHTML=data.map(c=>`<tr>
    <td>${esc(c.name||'—')}</td>
    <td class="td-mono">${esc(c.email)}</td>
    <td class="td-muted">${c.created_at?new Date(c.created_at).toLocaleString('zh-CN',{hour12:false}):'—'}</td>
    <td><button class="del-btn" onclick="deleteCustomer('${c.id}','${esc(c.email)}')">删除</button></td>
  </tr>`).join('');
}

async function addCustomer(){
  const name=document.getElementById('newName').value.trim();
  const email=document.getElementById('newEmail').value.trim();
  if(!name||!email){showMsg('addMsg','请填写名称和邮箱','error');return;}
  const btn=event.target;btn.disabled=true;btn.textContent='添加中...';
  const {error}=await sb.from('customers').insert({name,email});
  if(error){showMsg('addMsg',error.code==='23505'?`邮箱已存在`:'添加失败：'+error.message,'error');}
  else{showMsg('addMsg','✅ 添加成功！','success');document.getElementById('newName').value='';document.getElementById('newEmail').value='';loadCustomers();loadCustomerSelect();}
  btn.disabled=false;btn.textContent='添加';
}

async function deleteCustomer(id,email){
  if(!confirm(`确定删除 ${email}？`))return;
  await sb.from('customers').delete().eq('id',id);
  loadCustomers();loadCustomerSelect();
}

// 报价配置
async function loadCustomerSelect(){
  const sel=document.getElementById('rateCustomer');
  const {data}=await sb.from('customers').select('id,name,email').order('name');
  if(!data)return;
  sel.innerHTML='<option value="">-- 选择客户 --</option>'+data.map(c=>`<option value="${c.id}">${esc(c.name)} (${esc(c.email)})</option>`).join('');
}

async function loadRates(){
  const tbody=document.getElementById('rateList');
  tbody.innerHTML='<tr class="empty-row"><td colspan="6"><span class="spinner-inline"></span>加载中...</td></tr>';
  const {data,error}=await sb.from('customer_rates').select('*,customers(name,email)').order('created_at',{ascending:false});
  if(error||!data){tbody.innerHTML=`<tr class="empty-row"><td colspan="6" style="color:var(--error)">加载失败</td></tr>`;return;}
  document.getElementById('rateCountBadge').textContent=`${data.length} 条`;
  if(!data.length){tbody.innerHTML='<tr class="empty-row"><td colspan="6">暂无报价配置</td></tr>';return;}
  tbody.innerHTML=data.map(r=>`<tr>
    <td>${r.customers?esc(r.customers.name):'—'}</td>
    <td><span class="rate-tag">${esc(r.channel)}</span></td>
    <td class="td-mono">首${r.first_weight}kg ¥${r.first_price}</td>
    <td class="td-mono">续${r.extra_unit}kg ¥${r.extra_price}</td>
    <td class="td-muted">${r.days_min}–${r.days_max}天</td>
    <td><button class="del-btn" onclick="deleteRate(${r.id})">删除</button></td>
  </tr>`).join('');
}

async function addRate(){
  const customer_id=document.getElementById('rateCustomer').value;
  const channel=document.getElementById('rateChannel').value.trim();
  const first_weight=parseFloat(document.getElementById('rateFirstWeight').value);
  const first_price=parseFloat(document.getElementById('rateFirstPrice').value);
  const extra_unit=parseFloat(document.getElementById('rateExtraUnit').value);
  const extra_price=parseFloat(document.getElementById('rateExtraPrice').value);
  const days_min=parseInt(document.getElementById('rateDaysMin').value);
  const days_max=parseInt(document.getElementById('rateDaysMax').value);
  if(!customer_id||!channel||isNaN(first_price)||isNaN(extra_price)){showMsg('rateMsg','请填写所有字段','error');return;}
  const btn=event.target;btn.disabled=true;btn.textContent='添加中...';
  const {error}=await sb.from('customer_rates').insert({customer_id,channel,first_weight,first_price,extra_unit,extra_price,days_min,days_max});
  if(error){showMsg('rateMsg','添加失败：'+error.message,'error');}
  else{showMsg('rateMsg','✅ 报价添加成功！','success');document.getElementById('rateChannel').value='';document.getElementById('rateFirstPrice').value='';document.getElementById('rateExtraPrice').value='';loadRates();}
  btn.disabled=false;btn.textContent='添加报价';
}

async function deleteRate(id){
  if(!confirm('确定删除此报价？'))return;
  await sb.from('customer_rates').delete().eq('id',id);
  loadRates();
}

function showMsg(id,text,type){const el=document.getElementById(id);el.textContent=text;el.className='msg '+type;}
</script>
</body>
</html>
